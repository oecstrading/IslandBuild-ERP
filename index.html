function parseDelimited(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const delimiter = ['\t', ';', ','].map(char => [char, first.split(char).length]).sort((a,b) => b[1]-a[1])[0][0];
  const rows = [];
  let row = [], field = '', state = 'start';
  function addField() {
    row.push(field);
    requireValue(row.length <= 100, 'A sheet can contain up to 100 columns.');
    field = ''; state = 'start';
  }
  function addRow() {
    addField(); rows.push(row); row = [];
    requireValue(rows.length <= 10001, 'A sheet can contain up to 10,000 data rows.');
  }
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (state === 'quote') {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') state = 'closed';
      else field += c;
    } else if (c === delimiter) addField();
    else if (c === '\r' || c === '\n') {
      if (c === '\r' && text[i+1] === '\n') i++;
      addRow();
    } else if (c === '"' && state === 'start') state = 'quote';
    else {
      requireValue(state !== 'closed' && c !== '"', 'Invalid quoting in the delimited file.');
      field += c; state = 'text';
    }
  }
  requireValue(state !== 'quote', 'A quoted field is missing its closing quote.');
  if (row.length || field || state !== 'start') addRow();
  return rows;
}

/* XLSX ZIP reader with limits on both declared and actual inflated sizes. */
function excelArchive(buffer) {
  const bytes = new Uint8Array(buffer);
  const zip = new DataView(buffer);
  const u16 = offset => zip.getUint16(offset,true);
  const u32 = offset => zip.getUint32(offset,true);
  const decode = new TextDecoder();
  const maxBytes = 16 * 1024 * 1024;
  let end = bytes.length - 22;
  while (end >= Math.max(0, bytes.length - 65557) &&
    (u32(end) !== 0x06054b50 || end + 22 + u16(end+20) !== bytes.length)) end--;
  requireValue(end >= Math.max(0, bytes.length - 65557) && !u16(end+4) && !u16(end+6), 'This is not a supported .xlsx workbook.');
  const count = u16(end+10);
  let cursor = u32(end+16);
  requireValue(count <= 2048 && cursor <= end, 'The workbook archive is too large or invalid.');
  const entries = new Map();
  for (let i=0;i<count;i++) {
    requireValue(cursor+46 <= end && u32(cursor) === 0x02014b50, 'Invalid workbook archive.');
    const next = cursor+46+u16(cursor+28)+u16(cursor+30)+u16(cursor+32);
    requireValue(next <= end, 'Invalid workbook directory.');
    const name = decode.decode(bytes.subarray(cursor+46,cursor+46+u16(cursor+28)));
    if (!entries.has(name)) entries.set(name,cursor);
    cursor = next;
  }
  return async name => {
    const entry = entries.get(name);
    if (entry === undefined) return null;
    const method = u16(entry+10), compressed = u32(entry+20), size = u32(entry+24), local = u32(entry+42);
    requireValue(!(u16(entry+8) & 1) && size <= maxBytes && local+30 <= end && u32(local) === 0x04034b50,
      'The workbook contains an encrypted, oversized or invalid file.');
    const start = local+30+u16(local+26)+u16(local+28);
    requireValue(start+compressed <= end && [0,8].includes(method) && (method !== 0 || compressed === size), 'Unsupported workbook compression.');
    const data = bytes.subarray(start,start+compressed);
    let plain = data;
    if (method === 8) {
      requireValue(typeof DecompressionStream === 'function', 'Use a current browser for Excel files, or save the sheet as CSV.');
      const reader = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
      plain = new Uint8Array(size);
      let length = 0;
      try {
        while (true) {
          const {value,done} = await reader.read();
          if (done) break;
          requireValue(length+value.length <= size, 'Workbook exceeds its declared size.');
          plain.set(value,length); length += value.length;
        }
        requireValue(length === size, 'Workbook data is incomplete.');
      } finally { await reader.cancel(); }
    }
    const xml = decode.decode(plain);
    requireValue(!/<!DOCTYPE|<!ENTITY/i.test(xml), 'Unsupported workbook XML.');
    const doc = new DOMParser().parseFromString(xml,'application/xml');
    requireValue(!xnodes(doc,'parsererror').length, 'Invalid workbook XML.');
    return doc;
  };
}
async function openExcel(buffer) {
  const xml = excelArchive(buffer);
  const book = await xml('xl/workbook.xml');
  const rels = await xml('xl/_rels/workbook.xml.rels');
  requireValue(book && rels, 'The file does not contain a readable Excel workbook.');
  const targets = new Map(xnodes(rels,'Relationship').filter(r => r.getAttribute('TargetMode') !== 'External' &&
    (r.getAttribute('Type') || '').endsWith('/worksheet')).map(r => [r.getAttribute('Id'),r.getAttribute('Target')]));
  const shared = await xml('xl/sharedStrings.xml');
  const richText = node => xnodes(node,'t').map(n => n.textContent).join('');
  const strings = shared ? xnodes(shared,'si').map(richText) : [];
  const sheets = xnodes(book,'sheet').map(sheet => {
    const attr = Array.from(sheet.attributes).find(a=>a.localName === 'id');
    const target = targets.get(attr?.value);
    if (!target) return null;
    const path = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    if (!/^xl\/worksheets\/[\w.-]+\.xml$/.test(path)) return null;
    return { name:sheet.getAttribute('name'), read:async () => {
      const doc = await xml(path);
      requireValue(doc, 'This worksheet could not be found.');
      const rows = xnodes(doc,'row');
      requireValue(rows.length <= 10001,'A sheet can contain up to 10,000 data rows.');
      return rows.map(row => {
        const values=[];
        for (const cell of xnodes(row,'c')) {
          const letters = /^([A-Z]+)[0-9]+$/.exec(cell.getAttribute('r') || '')?.[1];
          const col = letters ? Array.from(letters).reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0)-1 : values.length;
          const type = cell.getAttribute('t');
          const raw = xnodes(cell,'v')[0]?.textContent ?? '';
          const value = type === 's' ? strings[Number(raw)] ?? '' : type === 'inlineStr' ? richText(cell) :
            type === 'b' ? raw === '1' ? 'true' : 'false' : raw;
          requireValue(type !== 'e' && (raw || !xnodes(cell,'f').length), 'Resolve worksheet errors or recalculate and save formula cells before importing.');
          if (col >= 100 && !value) continue;
          requireValue(col < 100,'A sheet can contain up to 100 columns.');
          values[col] = value;
        }
        return values;
      });
    }};
  }).filter(Boolean);
  requireValue(sheets.length, 'The workbook has no importable worksheets.');
  return sheets;
}

function importRows(matrix,kind) {
  const start = matrix.findIndex(row=>row.some(v=>String(v??'').trim()));
  requireValue(start >= 0,'The worksheet is empty.');
  const supported = new Set(IMPORT_TYPES[kind][1].split(','));
  const headers = matrix[start].map(value=>{
    const key = String(value??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
    const dest = IMPORT_ALIASES[kind][key] || key;
    return supported.has(dest) ? dest : '';
  });
  const recognized = headers.filter(Boolean);
  requireValue(new Set(recognized).size === recognized.length,'Two columns map to the same field.');
  const missing = IMPORT_REQUIRED[kind].filter(name=>!recognized.includes(name));
  requireValue(!missing.length,'Missing columns: '+missing.join(', ')+'. Download the template for this import.');
  const data = matrix.slice(start+1).flatMap((row,index)=>{
    if (!row.some(v=>String(v??'').trim())) return [];
    return [{ number:start+index+2, values:Object.fromEntries(recognized.map(key=>[key,String(row[headers.indexOf(key)]??'').trim()])) }];
  });
  requireValue(data.length,'There are no data rows under the headers.');
  return {data,columns:recognized};
}
function importMoney(value,label,required=false) {
  if (!value && !required) return 0;
  const text = String(value ?? '').replace(/^(?:EC\$|XCD\s+|\$)/i,'');
  requireValue(/^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?$/.test(text) &&
    Number(text.replaceAll(',','')) <= 1000000000, 'Enter a nonnegative '+label+' with up to two decimal places.');
  return Number(text.replaceAll(',',''));
}
function importIdentifier(value,label) {
  requireValue(/^[\w.-]{1,100}$/.test(value),label+' may contain letters, numbers, dots, hyphens and underscores.');
  return value;
}
function importAccount(value, type) {
  const a = account(value);
  requireValue(a && (!type || a.type === type), 'Choose an existing '+(type ? type.toLowerCase()+' ' : '')+'account for '+value+'.');
  return a.code;
}
function getOpeningAssetTotals(items=db.items) {
  return {
    '1200': r2(items.filter(i=>i.type==='Inventory').reduce((sum,i)=>sum+stockValue(i),0)),
    '1500': r2(items.filter(i=>i.type==='Rental').reduce((sum,i)=>sum+i.qty*i.cost,0))
  };
}
function buildImport(kind, sheet, options) {
  const {data,columns}=importRows(sheet,kind);
  const errors=[], rows=[], lines=[], warnings=[];
  const seen = new Set();
  const kindParty = kind==='customers' || kind==='vendors';
  const isOpening = kind==='opening';
  const isPayroll = kind==='payroll';
  const accounted = db.gl.filter(e=>e.source !== 'Import Stock');
  if (isOpening) {
    requireValue(!accounted.length, 'Opening trial balance requires an empty ledger or one containing only imported stock. Use Start Empty Company for a migration.');
    requireValue(!db.gl.some(e=>e.source==='Import Stock' && e.date!==options.date),'Use the same opening date as the imported opening stock.');
  }
  if (isOpening || isPayroll) requireValue(validDate(options.date) && options.date<=today(),'Enter a posting date through today.');
  if (isPayroll) {
    requireValue(options.approved, 'Confirm the file is one approved Caribbean Payroll run for this company and is in XCD.');
    requireValue(options.run && options.run.length <= 100, 'Enter the payroll run ID or another unique reference from Payroll History.');
    requireValue(!db.gl.some(e=>e.source==='Caribbean Payroll' && e.ref.toLowerCase()===options.run.toLowerCase()),
      'This payroll run reference was already posted.');
  }
  for (const record of data) {
    const v=record.values;
    function unique(value,population=[]) {
      const key=value.toLowerCase();
      requireValue(!seen.has(key) && !population.some(id=>id.toLowerCase()===key),'Duplicate identifier: '+value+'.');
      seen.add(key);
    }
    try {
      if (kind==='items') {
        const type = ({inventory:'Inventory',stock:'Inventory',material:'Inventory',rental:'Rental',equipment:'Rental',tool:'Rental',service:'Service'})[v.type.toLowerCase()];
        requireValue(['Inventory','Rental','Service'].includes(type) && v.name && v.sku,'Enter SKU, name and type (Inventory, Rental or Service).');
        unique(v.sku,db.items.map(i=>i.sku));
        const qty=importMoney(v.quantity,'quantity'), cost=importMoney(v.cost,'unit cost');
        requireValue(type!=='Rental' || Number.isInteger(qty),'Rental quantity must be a whole number.');
        requireValue(type!=='Service' || qty===0,'Services must have zero stock.');
        const tax=(v.taxable||'yes').toLowerCase();
        requireValue(['yes','no','true','false','1','0'].includes(tax),'Taxable must be Yes or No.');
        const levy = (v.hsl_eligible || 'no').toLowerCase();
        requireValue(['yes','no','true','false','1','0'].includes(levy),'HSL eligible must be Yes or No.');
        const item={hslEligible:['yes','true','1'].includes(levy),sku:v.sku,name:v.name,type,qty,cost,onRent:0,category:v.category||'',unit:v.unit||'unit',
          price:importMoney(v.price,'price'),reorder:importMoney(v.reorder,'reorder quantity'),
          taxable:['yes','true','1'].includes(tax), dayRate:importMoney(v.daily_rate,'daily rate'),
          weekRate:importMoney(v.weekly_rate,'weekly rate'),monthRate:importMoney(v.monthly_rate,'monthly rate'),
          deposit:importMoney(v.deposit,'deposit'),
          revAcct:importAccount(v.revenue_account||(type==='Rental'?'4020':type==='Service'?'4000':'4010'),'Revenue'),
          cogsAcct:importAccount(v.cogs_account||(type==='Rental'?'6200':'5000'),'Expense')};
        requireValue(type!=='Rental' || item.dayRate>0,'Rental tools need a positive daily rate.');
        if (type==='Inventory') item.stockValue=r2(qty*cost);
        rows.push(item);
      } else if (kindParty) {
        requireValue(v.name,'Name is required.');
        const id=v.id ? importIdentifier(v.id,'Party ID') : '';
        if (id) unique(id,db[kind].map(p=>p.id));
        else unique(v.name,db[kind].map(p=>p.name));
        rows.push({id,name:v.name,contact:v.contact||'',phone:v.phone||'',email:v.email||'',addr:v.address||'',terms:v.terms||db.company.terms||''});
      } else if (kind==='accounts') {
        const code=importIdentifier(v.code,'Account code');
        unique(code,db.accounts.map(a=>a.code));
        const type=['Asset','Liability','Equity','Revenue','Expense'].find(t=>t.toLowerCase()===v.type.toLowerCase());
        requireValue(type && v.name,'Enter an account name and a valid account type.');
        requireValue(code!=='3090' && (code!==HSL_ACCOUNT || (type==='Liability' && v.name==='Health & Security Levy Payable')),'Account '+code+' is reserved by IslandBuild.');
        rows.push({code,name:v.name,type});
      } else if (isOpening) {
        const code=importAccount(v.account_code);
        unique(code);
        const debit=importMoney(v.debit,'debit'),credit=importMoney(v.credit,'credit');
        requireValue(!(debit && credit),'Use either a debit or a credit on each account row.');
        requireValue(code!=='3090' || !(debit||credit),'Opening stock clearing (3090) must end at zero.');
        rows.push({code,debit,credit});
      } else {
        const gross=importMoney(v.gross,'gross pay',true), paye=importMoney(v.paye,'PAYE',true);
        const nic=importMoney(v.nic,'employee NIC/NIS',true), deductions=importMoney(v.deductions,'total deductions',true);
        const net=importMoney(v.net,'net pay',true);
        requireValue(r2(gross-deductions)===net && r2(deductions-paye-nic)>=0,'Gross less total deductions must equal net, and deductions must cover PAYE plus employee NIC/NIS.');
        requireValue(!v.currency || v.currency.toUpperCase()==='XCD','This company ledger accepts XCD payroll only.');
        let projectId=options.project;
        if (v.project) {
          const name=v.project.toLowerCase();
          const found=(db.projects||[]).filter(p=>p.id.toLowerCase()===name || p.name.trim().toLowerCase()===name);
          requireValue(found.length===1,'Enter a unique existing project ID or name.');
          projectId=found[0].id;
        }
        requireValue(!projectId || (db.projects||[]).some(p=>p.id===projectId && !p.closed && options.date>=p.start),'Payroll posting date must be on or after the selected project’s start date.');
        rows.push({ gross,paye,nic,deductions,net,projectId,employer:columns.includes('employer_nic') ?
          importMoney(v.employer_nic,'employer NIC/NIS',true):0 });
      }
    } catch (error) { errors.push('Row '+record.number+' · '+error.message); }
  }
  if (errors.length) return { rows,lines,errors,warnings };
  if (kind==='items') {
    const assets=getOpeningAssetTotals(rows);
    if (rows.some(i=>i.qty)) {
      requireValue(!accounted.length,'For an active company, import catalogue items with zero quantity and receive materials through a vendor bill or stock adjustment.');
      requireValue(validDate(options.date) && options.date<=today(),'Enter a stock posting date through today.');
      if (!accounted.length)
        requireValue(!db.gl.some(e=>e.source==='Import Stock' && e.date!==options.date),'Use the same opening date as previous stock uploads.');
    }
    if (Object.values(assets).some(Boolean)) {
      const clearing=account('3090');
      requireValue(!clearing || clearing.type==='Equity' && clearing.name==='Opening Stock Clearing','Account 3090 is reserved for Opening Stock Clearing.');
      lines.push(...Object.entries(assets).filter(([,debit])=>debit).map(([code,debit])=>({code,debit})),
        {code:'3090',credit:r2(assets['1200']+assets['1500'])});
    }
  }
  if (isOpening) {
    requireValue(r2(rows.reduce((sum,l)=>sum+l.debit-l.credit,0))===0,'The opening trial balance must balance to the cent.');
    const totals=new Map(rows.map(l=>[l.code,r2(l.debit-l.credit)]));
    for (const [code,value] of Object.entries(getOpeningAssetTotals()))
      requireValue((totals.get(code)||0)===value,'Account '+code+' must equal imported opening stock/equipment of '+money(value)+'. Import the quantities and costs first.');
    for (const a of db.accounts) {
      const existing=db.gl.flatMap(e=>e.lines).filter(l=>l.code===a.code).reduce((s,l)=>s+l.debit-l.credit,0);
      const delta=r2((totals.get(a.code)||0)-existing);
      if (delta) lines.push({code:a.code,debit:Math.max(0,delta),credit:Math.max(0,-delta)});
    }
    requireValue(lines.length,'Enter an opening trial balance with balances to post.');
    if (totals.get('1100') || totals.get('2000')) warnings.push('Trade receivables and payables will post as ledger balances only. Customer invoices, vendor bills and aging details are outside this opening import.');
  }
  if (isPayroll) {
    if (!columns.includes('employer_nic')) {
      const amount=importMoney(options.employer,'employer NIC/NIS total',true);
      const projects=new Set(rows.map(r=>r.projectId));
      requireValue(!amount || projects.size===1,'For multiple projects, add employer_nic per row so the contribution can be allocated correctly.');
      rows[0].employer=amount;
    }
    const {wages,overhead,burden,net,paye,nic,other}=options.accounts;
    importAccount(wages,'Expense'); importAccount(burden,'Expense');
    [net,paye,nic,other].forEach(code=>importAccount(code,'Liability'));
    const journal=new Map();
    function add(code,amount,projectId='') {
      if (!amount) return;
      const key=JSON.stringify([code,projectId,amount>0]);
      const old=journal.get(key) || {code,projectId,debit:0,credit:0};
      old.debit=r2(old.debit+Math.max(0,amount));
      old.credit=r2(old.credit+Math.max(0,-amount));
      journal.set(key,old);
    }
    for (const r of rows) {
      add(r.projectId ? wages : overhead,r.gross,r.projectId);
      add(burden,r.employer,r.projectId);
      add(net,-r.net); add(paye,-r.paye); add(nic,-r2(r.nic+r.employer));
      add(other,-r2(r.deductions-r.paye-r.nic));
    }
    importAccount(overhead,'Expense');
    lines.push(...journal.values());
    requireValue(lines.length,'The payroll file has no amounts to post.');
  }
  return {rows,lines,errors,warnings};
}

function showIntakeSheets(sheets,file) {
  intake.sheets=sheets; intake.sheet=0; intake.file=file;
  const select=document.getElementById('importSheet');
  if (!select) return;
  select.innerHTML=sheets.map((sheet,index)=>`<option value="${index}">${esc(sheet.name)}</option>`).join('');
  select.disabled=!sheets.length;
  document.getElementById('intakePreviewButton').disabled=!sheets.length;
  document.getElementById('importFileStatus').textContent=file;
}
async function loadIntakeFile(file) {
  clearIntakePreview();
  showIntakeSheets([], '');
  if (!file) return;
  const state=intake;
  try {
    requireValue(file.size>0 && file.size<=10*1024*1024,'Choose a nonempty file under 10 MB.');
    state.busy=true;
    document.getElementById('importUpload').disabled=true;
    document.getElementById('importFileStatus').textContent='Reading file…';
    const suffix=file.name.split('.').pop().toLowerCase();
    requireValue(['xlsx','csv','tsv'].includes(suffix),'Choose an Excel .xlsx or a CSV file. Save older .xls workbooks as .xlsx or CSV.');
    const sheets=suffix==='xlsx' ? await openExcel(await file.arrayBuffer()) :
      [{name:'Data',read:async ()=>parseDelimited(await file.text())}];
    if (intake===state) showIntakeSheets(sheets,file.name);
  } catch(error) {
    if (intake===state) showIntakeSheets([],error.message);
  } finally {
    state.busy=false;
    const upload=document.getElementById('importUpload');
    if (intake===state && upload) upload.disabled=false;
  }
}
function intakeOptions() {
  return { date:val('importDate'), run:val('importRun'), employer:val('importEmployer'),project:val('importProject'),
    approved:!!document.getElementById('importApproved')?.checked,
    accounts:Object.fromEntries(Object.keys(PAYROLL_ACCOUNTS).map(key=>[key,val('payMap_'+key)])) };
}
async function previewIntake() {
  clearIntakePreview();
  const state=intake, generation=state.validation;
  const src=state.sheets[state.sheet];
  if (!src) return;
  const target=document.getElementById('intakePreview');
  target.textContent='Validating…';
  const options=intakeOptions();
  try {
    const matrix=await src.read();
    if (intake!==state || state.validation!==generation || !target.isConnected) return;
    const plan=buildImport(state.kind,matrix,options);
    if (plan.errors.length) {
      target.innerHTML=`<p role="alert">${plan.errors.length} row(s) need correction. No records were posted.</p>
        <ul>${plan.errors.slice(0,30).map(msg=>`<li>${esc(msg)}</li>`).join('')}</ul>`;
      return;
    }
    state.preview={matrix,options,snapshot:savedSnapshot};
    const labels={items:['SKU','Item','Type','Quantity','Unit cost'],customers:['ID','Name','Email'],
      vendors:['ID','Name','Email'],accounts:['Code','Name','Type'],opening:['Account','Debit','Credit'],
      payroll:['Project','Gross pay','Deductions','Net pay','Employer NIC/NIS']};
    function previewRow(r) {
      if (state.kind==='items') return [r.sku,r.name,r.type,r.qty,money(r.cost)];
      if (state.kind==='opening') return [r.code,money(r.debit),money(r.credit)];
      if (state.kind==='payroll') return [(db.projects||[]).find(p=>p.id===r.projectId)?.name||'Overhead',
        money(r.gross),money(r.deductions),money(r.net),money(r.employer)];
      if (state.kind==='accounts') return [r.code,r.name,r.type];
      return [r.id||'Assigned on import',r.name,r.email];
    }
    const table=(heads,rows)=>`<div style="overflow:auto"><table><thead><tr>${heads.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const ledger=plan.lines.map(l=>[l.code+' · '+(account(l.code)?.name||'Opening Stock Clearing'),
      (db.projects||[]).find(p=>p.id===l.projectId)?.name||'—',money(l.debit),money(l.credit)]);
    const ledgerTotal = money(r2(plan.lines.reduce((sum,l)=>sum+(l.debit||0),0)));
    target.innerHTML=`<h3>${plan.rows.length} validated rows</h3><p class="muted">Showing the first 15 rows. Review the proposed records before posting.</p>
      ${table(labels[state.kind],plan.rows.slice(0,15).map(previewRow))}
      ${plan.warnings.map(w=>`<p class="pill warn">${esc(w)}</p>`).join('')}
      ${ledger.length?`<h3>Journal preview</h3><p>Total debits and credits ${ledgerTotal} each</p>${table(['Account','Project','Debit','Credit'],ledger)}`:''}
      <p><button class="btn" type="button" onclick="commitIntake()">Post import</button></p>`;
  } catch(error) {
    if (intake===state && state.validation===generation) target.textContent=error.message;
  }
}
function commitIntake() {
  const {kind,file,sheets,sheet,preview}=intake;
  if (!preview) return;
  requireValue(preview.snapshot===savedSnapshot,'Company records changed. Validate the file again before posting.');
  requireValue(JSON.stringify(intakeOptions())===JSON.stringify(preview.options),'Import settings changed. Validate the file again.');
  const plan=buildImport(kind,preview.matrix,preview.options);
  requireValue(!plan.errors.length,'Data changed. Validate the file again.');
  const ref=kind==='payroll' ? preview.options.run : 'IMP-'+uid();
  atomic(()=>{
    if (kind==='items') {
      db.items.push(...plan.rows.map(row=>({id:'ITM-'+uid(),...row})));
      if (plan.lines.length && !account('3090')) db.accounts.push({code:'3090',name:'Opening Stock Clearing',type:'Equity'});
    } else if (kind==='customers' || kind==='vendors') {
      db[kind].push(...plan.rows.map(row=>({...row,id:row.id || (kind==='customers'?'CUST-':'VEND-')+uid()})));
    } else if (kind==='accounts') db.accounts.push(...plan.rows);
    const source={items:'Import Stock',opening:'Opening Import',payroll:'Caribbean Payroll'}[kind];
    if (plan.lines.length) {
      const entry=post(preview.options.date,IMPORT_TYPES[kind][0]+' · '+ref,ref,source,plan.lines);
      entry.lines.forEach((line,index)=>{
        if (plan.lines[index].projectId) line.projectId=plan.lines[index].projectId;
      });
    }
    (db.importHistory ||= []).push({kind,file,sheet:sheets[sheet].name,count:plan.rows.length,ref,posted:new Date().toISOString()});
  });
  changeIntakeType(kind);
  toast(plan.rows.length+' rows imported · '+ref,'ok');
}
function downloadImportTemplate() {
  const [,headers,...rows]=IMPORT_TYPES[intake.kind];
  downloadFile('IslandBuild-'+intake.kind+'-template.csv',[headers,...rows].join('\r\n')+'\r\n','text/csv;charset=utf-8');
}

/* Construction contract administration and retention accounting. */
const RETENTION_ACCOUNT = '1110';
function job(id) { return (db.projects || []).find(p => p.id === id); }
function contractInvoices(id) { return db.invoices.filter(i => i.projectId === id && i.source !== 'Retention Release'); }
function jobCommercial(p) {
  const invoices = contractInvoices(p.id);
  const releases = db.invoices.filter(i => i.projectId === p.id && i.source === 'Retention Release');
  const value = r2((p.contract?.value || 0) + (p.variations || []).reduce((sum,v)=>sum+v.amount,0));
  const billed = r2(invoices.reduce((sum,i)=>sum+i.subtotal,0));
  const held = r2(invoices.reduce((sum,i)=>sum+(i.retentionHeld || 0),0) - releases.reduce((sum,i)=>sum+i.total,0));
  const ordinaryDue = r2(invoices.reduce((sum,i)=>sum+invoiceDue(i),0));
  const releaseDue = r2(releases.reduce((sum,i)=>sum+invoiceDue(i),0));
  const cash = r2([...invoices,...releases].reduce((sum,i)=>sum+i.paid,0));
  const phase = p.closed ? 'Closed' : p.finalAccount ? (ordinaryDue ? 'Awaiting final payment' :
    held ? 'Retention held' : releaseDue ? 'Awaiting retention payment' : 'Ready to close') :
    p.signoff ? 'Signed off' : p.status === 'On Hold' ? 'On Hold' :
    p.contract ? (invoices.length || p.status === 'Active' ? 'In progress' : 'Contract signed') : p.status;
  return { invoices,releases,value,billed,held,ordinaryDue,releaseDue,cash,phase,remaining:r2(value-billed) };
}

    <p><strong>${esc(f.phase)}</strong> ${p.contract ? '· Contract '+esc(p.contract.ref)+' · Signed '+esc(p.contract.date) : ''}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      ${!p.contract ? button('contract','Record signed contract') : ''}
      ${p.contract && !p.signoff ? button('variation','Approved variation') : ''}
      ${p.contract && !p.signoff && p.status!=='On Hold' ? button('progress','Progress certificate') : ''}
      ${p.contract && !p.signoff ? button('signoff','Record completion sign-off') : ''}
      ${p.signoff && !p.finalAccount ? button('final','Post final account') : ''}
      ${p.finalAccount && !f.ordinaryDue && f.held>0 ? button('release','Release retention') : ''}
      ${f.phase==='Ready to close' ? button('close','Close project') : ''}</div>
    ${!p.contract ? '<p class="muted">Record the signed contract to manage certified claims, sign-off and retention.</p>' : `
      <div style="overflow:auto"><table><tbody>
      <tr><th>Original contract ex tax</th><td>${money(p.contract.value)}</td><th>Revised contract ex tax</th><td>${money(f.value)}</td></tr>
      <tr><th>Certified / billed ex tax</th><td>${money(f.billed)}</td><th>Contract remaining to bill</th><td>${money(f.remaining)}</td></tr>
      <tr><th>Invoice balance due</th><td>${money(f.ordinaryDue)}</td><th>Cash received</th><td>${money(f.cash)}</td></tr>
      <tr><th>Unreleased retention</th><td>${money(f.held)}</td><th>Released retention due</th><td>${money(f.releaseDue)}</td></tr>
      <tr><th>Retention terms</th><td>${p.contract.rate}% before tax${p.contract.cap ? ' · cap '+money(p.contract.cap) : ''}</td>
      <th>Retention eligible from</th><td>${esc(p.signoff?.releaseDate || 'Set at sign-off')}</td></tr></tbody></table></div>
      <p class="muted">Certificate billing posts revenue when billed. Retention is withheld from the pre-tax amount. VAT and HSL, where applicable, are charged at certification.</p>
      ${p.variations?.length ? `<div class="sec-title">Approved variations</div><ul>${p.variations.map(v=>`<li>${esc(v.date)} · ${esc(v.ref)} · ${money(v.amount)} contract change · ${money(v.budgetChange||0)} budget change${v.revisedDue ? ' · finish '+esc(v.revisedDue) : ''} · ${esc(v.note)}</li>`).join('')}</ul>` : ''}
      ${p.signoff ? `<p><strong>Completion sign-off</strong> · ${esc(p.signoff.date)} · ${esc(p.signoff.person)} · ${esc(p.signoff.ref)}${p.signoff.note ? ' · '+esc(p.signoff.note) : ''}</p>` : ''}
      ${p.finalAccount ? `<p><strong>Final account</strong> · ${esc(p.finalAccount.date)} · ${esc(p.finalAccount.ref)}</p>` : ''}
      ${p.closed ? `<p><strong>Closed</strong> · ${esc(p.closed.date)} · ${esc(p.closed.ref)}</p>` : ''}`}
    ${payments.length ? `<div class="sec-title">Billing, retention and collections</div>
      <div style="overflow:auto"><table><thead><tr><th>Document</th><th>Certificate / reference</th><th>Total</th><th>Retention withheld</th><th>Paid</th><th>Due</th><th></th></tr></thead>
      <tbody>${payments.map(i=>`<tr><td><button class="btn-sm" onclick="showInvoice('${i.id}')">${esc(i.id)}</button></td>
      <td>${esc(i.certificateRef || i.source)}</td><td>${money(i.total)}</td><td>${money(i.retentionHeld||0)}</td><td>${money(i.paid)}</td><td>${money(invoiceDue(i))}</td>
      <td>${invoiceDue(i)>0 ? `<button class="btn-sm" onclick="payInvoiceModal('${i.id}')">Record payment</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
}
const JOB_ACTIONS = {
  contract:'Record signed contract',variation:'Record approved variation',progress:'Post progress certificate',
  signoff:'Record completion sign-off',final:'Post final account',release:'Release retention',close:'Close project'
};
function jobAction(id, action) {
  const p=job(id);
  const f=jobCommercial(p), t=p.terms || {}, draft=t.draftContract || {};
  const milestones=action==='progress' && t.billing==='Accepted milestones';
  const amount=(label,value='',min='0')=>`<div class="field"><label for="lcAmount">${label}</label>
    <input class="inp" type="number" id="lcAmount" step=".01" ${min!==''?`min="${min}"`:''} value="${value}"></div>`;
  const date=(name,label,value)=>`<div class="field"><label for="${name}">${label}</label><input class="inp" type="date" id="${name}" value="${value}"></div>`;
  const text=(name,label,value='')=>`<div class="field"><label for="${name}">${label}</label><input class="inp" id="${name}" maxlength="160" value="${esc(value)}"></div>`;
  const billing=['progress','final'].includes(action);
  const note=`<div class="field"><label for="lcNote">Description or remarks</label><textarea class="inp" id="lcNote" rows="3"></textarea></div>`;
  let fields=text('lcRef',action==='contract'?'Signed contract number':'Certificate or approval reference',action==='contract'?draft.ref:'')+
    date('lcDate','Effective date',today());
  if (action==='contract') fields+=amount('Original contract amount before VAT and HSL',draft.value || '')+
    `<div class="row"><div class="field"><label for="lcRate">Retention (%)</label><input class="inp" id="lcRate" type="number" min="0" max="100" step=".01" value="${draft.rate ?? 0}"></div>
    <div class="field"><label for="lcCap">Retention cap, optional</label><input class="inp" id="lcCap" type="number" min="0" step=".01" value="${draft.cap || ''}"></div></div>`;
  if (action==='variation') fields+=amount('Change in customer contract value (negative for reduction)','0','')+
    termField('budgetChange','Change in project cost budget (negative for reduction)',0,'number','step=".01"')+
    date('lcRevisedDue','Approved revised finish date',p.due);
  if (milestones) fields+=`<div class="field"><label for="lcMilestone">Accepted milestone</label>
    <select class="inp" id="lcMilestone" onchange="chooseBillingMilestone('${id}')"><option value="">Choose milestone</option>
    ${p.tasks.filter(x=>x.status==='Done' && x.billingValue>0 && x.acceptanceRef && !f.invoices.some(i=>i.milestoneId===x.id))
      .map(x=>`<option value="${x.id}">${esc(x.name)} · ${money(x.billingValue)} · ${esc(x.acceptanceRef)}</option>`).join('')}</select></div>`;
  if (billing) fields+=amount('Incremental certified amount before VAT and HSL',action==='final'?Math.max(0,f.remaining):'')+
    date('lcDue','Invoice due date',jobDatePlus(today(),t.paymentDays??30))+
    `<p><label><input type="checkbox" id="lcVat" ${t.taxable!==false?'checked':''}> VAT taxable</label>
    <label><input type="checkbox" id="lcHsl" ${t.hsl===true?'checked':''}> HSL eligible</label></p>`+
    '<div id="lcPreview" aria-live="polite"></div>';
  if (action==='signoff') fields+=text('lcPerson','Client or certifier signing off',t.clientRep)+date('lcDue','Retention eligible for release from',jobDatePlus(today(),t.defectsDays??0));
  if (action==='release') fields+=amount('Amount to release',f.held)+date('lcDue','Retention payment due date',jobDatePlus(today(),t.retentionDays??30))+
    '<p class="muted">Moves retention into trade receivables for collection.</p>';
  openModal(JOB_ACTIONS[action],`<div oninput="updateJobPreview('${id}','${action}')">${fields}${note}</div>`,
    `<button class="btn ghost" onclick="showProject('${id}')">Back</button><button class="btn" onclick="saveJobAction('${id}','${action}')">${JOB_ACTIONS[action]}</button>`, 'wide');
  document.getElementById('lcDate').addEventListener('change',()=>jobFormDateChanged(id,action));
  updateJobPreview(id,action);
}
function jobRetention(p, amount) {
  const retained=contractInvoices(p.id).reduce((s,i)=>s+(i.retentionHeld||0),0);
  const calculated=r2(amount*p.contract.rate/100);
  return p.contract.cap ? Math.max(0,r2(Math.min(calculated,p.contract.cap-retained))) : calculated;
}
function updateJobPreview(id, action) {
  if (!['progress','final'].includes(action)) return;
  const amount=nval('lcAmount');
  const tax=salesTaxes([{qty:1,rate:amount,taxable:document.getElementById('lcVat').checked,hslEligible:document.getElementById('lcHsl').checked}]);
  const retained=jobRetention(job(id),Math.max(0,amount));
  document.getElementById('lcPreview').innerHTML=invoiceTaxRows(tax,'style="display:flex;justify-content:space-between"')+
    `<p>Retention withheld <strong>${money(retained)}</strong> · Collectible now <strong>${money(r2(tax.total-retained))}</strong></p>`;
}
function chronologicalJobDate(p) {
  return [p.contract?.date,p.signoff?.date,p.finalAccount?.date,...(p.variations||[]).map(v=>v.date),
    ...db.invoices.filter(i=>i.projectId===p.id).map(i=>i.date)].filter(Boolean).sort().at(-1) || '';
}
function saveJobAction(id, action) {
  const p=job(id);
  requireValue(p && !p.closed,'This project is closed.');
  const date=val('lcDate'),ref=val('lcRef'),note=val('lcNote'),due=val('lcDue');
  const amount=val('lcAmount') ? Number(val('lcAmount')) : NaN;
  const f=jobCommercial(p);
  requireValue(ref && validDate(date) && date<=today(),'Enter a reference and an effective date through today.');
  requireValue(action==='contract' || p.contract && date>=chronologicalJobDate(p),'Record the contract first and use dates in chronological order.');
  const validAmount=Number.isFinite(amount) && r2(amount)===amount && Math.abs(amount)<=1000000000;
  atomic(()=>{
    if (action==='contract') {
      const rate=Number(val('lcRate')),cap=Number(val('lcCap'));
      requireValue(validAmount && val('lcRate')!=='','Enter a contract value and retention percentage.');
      approveProjectContract(p,{ref,date,note,value:amount,rate,cap});
    } else if (action==='variation') {
      const budgetChange=Number(val('term_budgetChange'));
      const revisedDue=val('lcRevisedDue') || p.due;
      requireValue(!p.signoff && validAmount && Number.isFinite(budgetChange) && r2(budgetChange)===budgetChange &&
        (amount || budgetChange || revisedDue!==p.due || note) && r2(f.value+amount)>=f.billed && r2(f.value+amount)>0 && note,
        'Enter an approved change with a description before sign-off. Revised value must cover billed work.');
      requireValue(validDate(revisedDue) && revisedDue>=p.start && p.tasks.every(t=>t.due<=revisedDue) &&
        r2(p.budget+budgetChange)>=(p.terms?.contingency || 0),'The revised date must include scheduled work and the revised budget must cover contingency.');
      requireValue(!(p.variations||[]).some(v=>v.ref.toLowerCase()===ref.toLowerCase()),'This variation is already recorded.');
      (p.variations ||= []).push({ref,date,note,amount,budgetChange,previousDue:p.due,revisedDue});
      p.budget=r2(p.budget+budgetChange);
      p.due=revisedDue;
    } else if (action==='progress' || action==='final') {
      const final=action==='final';
      requireValue(!p.finalAccount && (final ? p.signoff : !p.signoff && p.status!=='On Hold'),'This certificate is out of sequence.');
      requireValue(validAmount && (final ? amount===f.remaining : amount>0 && amount<=f.remaining),'Enter an amount within the unbilled contract value. The final account must equal the remaining value.');
      requireValue(validDate(due) && due>=date,'Enter an invoice due date on or after the certificate date.');
      requireValue(!f.invoices.some(i=>i.certificateRef?.toLowerCase()===ref.toLowerCase()),'This certificate is already posted.');
      let milestoneId;
      if (!final && p.terms?.billing==='Accepted milestones') {
        const milestone=p.tasks.find(t=>t.id===val('lcMilestone'));
        requireValue(milestone?.status==='Done' && milestone.acceptanceRef && milestone.billingValue===amount &&
          !f.invoices.some(i=>i.milestoneId===milestone.id),'Choose an unbilled accepted milestone and use its approved amount.');
        milestoneId=milestone.id;
      }
      const inv=amount ? createInvoice({customerId:p.customerId,projectId:p.id,date,dueDate:due,
        source:final?'Construction Final':'Construction Progress',certificateRef:ref,milestoneId,retentionHeld:jobRetention(p,amount),
        notes:note,lines:[{desc:(final?'Final account ':'Progress certificate ')+ref,qty:1,rate:amount,
          revAcct:'4000',taxable:document.getElementById('lcVat').checked,hslEligible:document.getElementById('lcHsl').checked}]}) : null;
      if (final) p.finalAccount={ref,date,note,invoiceId:inv?.id || ''};
      else p.status='Active';
    } else if (action==='signoff') {
      const person=val('lcPerson');
      requireValue(!p.signoff && person && validDate(due) && due>=jobDatePlus(date,p.terms?.defectsDays??0) && date>=p.start && p.tasks.every(t=>t.status==='Done'),
        'Finish scheduled tasks, enter the signatory and allow for the agreed minimum retention period.');
      p.signoff={ref,date,releaseDate:due,person,note};
    } else if (action==='release') {
      requireValue(p.finalAccount && !f.ordinaryDue && date>=p.signoff.releaseDate && validAmount && amount>0 && amount<=f.held,
        'Settle the project invoices, reach the retention release date and enter an amount within the retention held.');
      requireValue(validDate(due) && due>=date,'Enter a retention due date on or after the release date.');
      requireValue(!f.releases.some(i=>i.certificateRef.toLowerCase()===ref.toLowerCase()),'This retention release is already posted.');
      const refs=new Set(f.invoices.map(i=>i.id));
      requireValue(!db.payments.some(payment=>refs.has(payment.ref) && payment.date>date),
        'The retention release date must be on or after settlement of the project invoices.');
      const invoice={id:nextNo('INV-','inv'),customerId:p.customerId,projectId:p.id,date,dueDate:due,notes:note,
        source:'Retention Release',certificateRef:ref,lines:[{desc:'Release of retention · '+ref,qty:1,rate:amount,amount}],
        subtotal:0,hsl:0,vat:0,vatBase:0,total:amount,paid:0,status:'Open'};
      post(date,'Construction retention released · '+ref,invoice.id,'Retention Release',
        [{code:'1100',debit:amount},{code:RETENTION_ACCOUNT,credit:amount}]);
      db.invoices.push(invoice);
    } else if (action==='close') {
      const bills=db.bills.filter(b=>b.projectId===id);
      requireValue(f.phase==='Ready to close' && bills.every(b=>billDue(b)===0),'Collect all invoices and retention, and settle all linked vendor bills before closing.');
      const refs=new Set([...f.invoices,...f.releases,...bills].map(i=>i.id));
      requireValue(!db.payments.some(payment=>refs.has(payment.ref) && payment.date>date),
        'The closure date must be on or after the last payment.');
      p.closed={ref,date,note};
      p.status='Complete';
    } else throw new Error('Unknown construction action.');
  });
  render();
  showProject(id);
  toast(JOB_ACTIONS[action]+' recorded','ok');
}

const JOB_TERMS = [
  ['site','Site address'],['manager','Project manager'],['clientRep','Client representative / certifier'],
  ['deliverables','Deliverables and scope exclusions'],['acceptance','Acceptance criteria and required handover documents'],
  ['requirements','Permits, safety, insurance and bonds'],['communication','Reporting, notice and change approval procedures'],
  ['risks','Key risks, assumptions, dependencies and responses'],['special','Special clauses, including advances, warranties or delay damages']

function termField(key,label,value='',type='text',attrs='') {
  return `<div class="field"><label for="term_${key}">${label}</label><input class="inp" id="term_${key}"
    type="${type}" value="${esc(value)}" ${attrs}></div>`;
}
function projectTermsFields(p) {
  const t=p?.terms || {};
  const c=p?.contract || t.draftContract || {};
  const locked=p?.contract?'disabled':'';
  const whole='min="0" max="3650" step="1"';
  const cash='min="0" max="1000000000" step=".01"';
  return `<details open><summary>Contract and billing terms</summary>
    <p class="muted">Record a signed contract now or keep the commercial terms in draft until approval.</p>
    <div class="grid g2">
      ${termField('ref','Contract or tender reference',c.ref,'text',locked)}
      ${termField('signed','Date signed (leave blank for draft)',c.date,'date',locked)}
      ${termField('value','Contract value before tax (XCD)',c.value,'number',cash+' '+locked)}
      ${termField('retention','Retention percentage',c.rate ?? 0,'number','min="0" max="100" step=".01" '+locked)}
      ${termField('cap','Retention cap (blank or zero for none)',c.cap || '','number',cash+' '+locked)}
      ${termField('paymentDays','Invoice payment days after certification',t.paymentDays ?? 30,'number',whole+' '+locked)}
      ${termField('retentionDays','Retention payment days after release',t.retentionDays ?? 30,'number',whole+' '+locked)}
      ${termField('defectsDays','Minimum days from sign-off to retention release',t.defectsDays ?? 0,'number',whole+' '+locked)}
      <div class="field"><label for="term_billing">Billing basis</label><select class="inp" id="term_billing" ${locked}>
      ${selectOptions(['Progress certificates','Accepted milestones'],t.billing)}</select></div>
      <div class="field"><label><input type="checkbox" id="term_vat" ${t.taxable!==false?'checked':''} ${locked}> VAT taxable by default</label><br>
      <label><input type="checkbox" id="term_hsl" ${t.hsl===true?'checked':''} ${locked}> HSL eligible by default</label></div>
    </div></details>
    <details><summary>Scope, accountability and risk</summary><div class="grid g2">
      ${JOB_TERMS.slice(0,3).map(([key,label])=>termField(key,label,t[key])).join('')}
      </div>${JOB_TERMS.slice(3).map(([key,label])=>`<div class="field"><label for="term_${key}">${label}</label>
        <textarea class="inp" id="term_${key}" rows="2">${esc(t[key])}</textarea></div>`).join('')}</details>
    <details><summary>Cost baseline and forecast</summary><p class="muted">The project cost budget includes its contingency. Enter a current estimate of costs still to incur when available.</p>
      <div class="grid g2">${termField('contingency','Contingency included in the cost budget',t.contingency ?? 0,'number',cash)}
      ${termField('etc','Estimated cost to complete',t.etc,'number',cash)}</div></details>`;
}
function readProjectTerms(p, data) {
  if (!document.getElementById('term_billing')) return p?.terms;
  function number(key, fallback, min, max, integer=false) {
    const raw=val('term_'+key);
    if (!raw) return fallback;
    const n=Number(raw);
    requireValue(Number.isFinite(n) && n>=min && n<=max && (integer?Number.isInteger(n):r2(n)===n),'Invalid value for '+key+'.');
    return n;
  }
  const terms={...p?.terms};
  for (const [key] of JOB_TERMS) terms[key]=val('term_'+key);
  terms.contingency=number('contingency',0,0,data.budget);
  terms.etc=number('etc',null,0,1e9);
  if (p?.contract) return terms;
  for (const key of ['paymentDays','retentionDays','defectsDays']) terms[key]=number(key,key==='defectsDays'?0:30,0,3650,true);
  terms.billing=val('term_billing');
  terms.taxable=document.getElementById('term_vat').checked;
  terms.hsl=document.getElementById('term_hsl').checked;
  const draft={ref:val('term_ref'),date:val('term_signed'),value:number('value',0,0,1e9),
    rate:number('retention',0,0,100),cap:number('cap',0,0,1e9)};
  requireValue(!draft.cap || draft.cap<=draft.value,'The retention cap cannot exceed contract value.');
  terms.draftContract=draft;
  return terms;
}
function approveProjectContract(p, contract) {
  const prior=jobCommercial(p).billed;
  requireValue(!p.contract && contract.ref && validDate(contract.date) && contract.date<=today() &&
    contract.value>0 && contract.value>=prior && contract.rate>=0 && contract.rate<=100 &&
    r2(contract.rate)===contract.rate && contract.cap>=0 && contract.cap<=contract.value && r2(contract.cap)===contract.cap,
    'Enter a signed reference, valid signing date and contract value covering prior billings, with valid retention terms.');
  requireValue(!(db.projects||[]).some(other=>other!==p && other.customerId===p.customerId &&
    other.contract?.ref.toLowerCase()===contract.ref.toLowerCase()),'This customer already has that contract reference.');
  p.contract=contract;
  p.baseline={start:p.start,due:p.due,budget:p.budget,scope:p.scope,deliverables:p.terms?.deliverables || '',
    contingency:p.terms?.contingency || 0};
  if (p.status==='Complete') p.status='Active';
}
function jobDatePlus(date,days) {
  if (!validDate(date)) return '';
  const value=new Date(date);
  value.setUTCDate(value.getUTCDate()+days);
  return value.toISOString().slice(0,10);
}
function projectControls(p,f) {
  const t=p.terms || {}, b=p.baseline;
  const forecast=t.etc == null ? null : r2(f.costs+t.etc);
  return `<div class="sec-title">Project baseline and controls</div>
    <div style="overflow:auto"><table><tbody>
    <tr><th>Baseline finish</th><td>${esc(b?.due || p.due)}</td><th>Current finish</th><td>${esc(p.due)}</td></tr>
    <tr><th>Baseline budget</th><td>${money(b?.budget ?? p.budget)}</td><th>Current budget</th><td>${money(p.budget)}</td></tr>
    <tr><th>Contingency within budget</th><td>${money(t.contingency || 0)}</td><th>Overdue work items</th><td>${p.tasks.filter(x=>x.status!=='Done' && x.due<today()).length}</td></tr>
    <tr><th>Forecast final cost</th><td>${forecast===null?'Enter estimate to complete':money(forecast)}</td><th>Forecast variance (budget less estimate)</th><td>${forecast===null?'—':money(p.budget-forecast)}</td></tr>
    </tbody></table></div>
    <p class="muted">${esc(t.billing || 'Progress certificates')} · ${t.paymentDays ?? 30} days to pay invoices · ${t.retentionDays ?? 30} days to pay releases · ${t.defectsDays ?? 0} minimum days before release</p>
    <details><summary>Project responsibilities, acceptance and special terms</summary>
      ${b?.scope ? `<p><strong>Baseline scope</strong> · ${esc(b.scope)}</p>` : ''}
      ${JOB_TERMS.filter(([key])=>t[key]).map(([key,label])=>`<p style="white-space:pre-wrap"><strong>${label}</strong> · ${esc(t[key])}</p>`).join('')}
    </details>`;
}
function jobFormDateChanged(id, action) {
  const p=job(id), t=p.terms || {};
  const offsets={progress:t.paymentDays??30,final:t.paymentDays??30,release:t.retentionDays??30,signoff:t.defectsDays??0};
  if (Object.hasOwn(offsets,action)) document.getElementById('lcDue').value=jobDatePlus(val('lcDate'),offsets[action]);
}
function chooseBillingMilestone(id) {
  const task=job(id).tasks.find(t=>t.id===val('lcMilestone'));
  document.getElementById('lcAmount').value=task?.billingValue ?? '';
  updateJobPreview(id,'progress');
}

(function boot() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    savedSnapshot = raw;
    const loaded = raw ? validateBackup(JSON.parse(raw)) : null;
    
    if (loaded && loaded.company && loaded.accounts && loaded.items) {
      db = loaded;
      // Ensure all arrays exist to prevent rendering crashes
      db.counters = db.counters || { inv: 0, bill: 0, rnt: 0, pay: 0, je: 0 };
      db.payments = db.payments || []; 
      db.gl = db.gl || [];
      db.invoices = db.invoices || [];
      db.bills = db.bills || [];
      db.rentals = db.rentals || [];
      db.customers = db.customers || [];
      db.vendors = db.vendors || [];
      db.items = db.items || [];
    } else { 
      atomic(seedDatabase); 
    }
    save(); 
    render();
  } catch (err) {
    console.error('Boot error:', err);
    document.getElementById('view').innerHTML = `<div class="card"><div class="card-b" style="color:var(--bad)">
      <h3>⚠️ Failed to Initialize</h3>
      <p>There was a problem loading the application.</p>
      <pre style="background:#f8fafc;padding:12px;border-radius:6px;font-size:12px">${esc(err.message)}</pre>
      <button class="btn" onclick="exportRawData()">Download Stored Data</button>
    </div></div>`;
  }
})();
</script>
