<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IslandBuild ERP — St. Lucia · AI Accountant</title>
<style>
  :root{
    --sidebar:#0b1220; --sidebar-2:#111c31; --bg:#f1f5f9; --panel:#fff;
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#0ea5e9; --brand-2:#0284c7; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626;
    --radius:10px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .sidebar{background:var(--sidebar);color:#cbd5e1;padding:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{padding:18px 16px;border-bottom:1px solid #1e293b;display:flex;gap:10px;align-items:center}
  .brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#0ea5e9,#22c55e);display:grid;place-items:center;font-weight:800;color:#04121f;font-size:15px}
  .brand h1{font-size:14px;margin:0;color:#f8fafc;letter-spacing:.2px}
  .brand span{font-size:10.5px;color:#64748b;display:block;margin-top:2px}
  .nav{padding:10px 8px 30px}
  .nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:#475569;padding:14px 10px 6px;font-weight:700}
  .nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;color:#cbd5e1;text-decoration:none;font-size:13px;cursor:pointer;margin-bottom:1px}
  .nav a:hover{background:#1a2740;color:#f1f5f9}
  .nav a.active{background:linear-gradient(90deg,#0ea5e9,#0284c7);color:#04121f;font-weight:600}
  .nav a .ic{width:16px;text-align:center;font-size:13px}
  main{display:flex;flex-direction:column;min-width:0}
  header.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
  header.topbar h2{margin:0;font-size:17px;font-weight:650}
  .topbar .meta{font-size:12px;color:var(--muted);display:flex;gap:16px;align-items:center}
  #view{padding:22px;flex:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card-h h3{margin:0;font-size:13.5px;font-weight:650}
  .card-b{padding:16px}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:1150px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
  @media(max-width:780px){#app{grid-template-columns:1fr}.sidebar{display:none}.g4,.g3,.g2{grid-template-columns:1fr}}
  .kpi{padding:15px 16px}
  .kpi .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kpi .val{font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi.blue .val{color:#0284c7}.kpi.green .val{color:#16a34a}.kpi.red .val{color:#dc2626}.kpi.amber .val{color:#d97706}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;background:#f8fafc}
  td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  tbody tr:hover{background:#f8fafc}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .btn{border:0;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--brand);color:#04121f;transition:.15s}
  .btn:hover{background:var(--brand-2);color:#fff}
  .btn.ghost{background:#f1f5f9;color:#334155}
  .btn.ghost:hover{background:#e2e8f0;color:#0f172a}
  .btn.ok{background:var(--ok);color:#fff}.btn.ok:hover{background:#15803d}
  .btn.danger{background:#fee2e2;color:#b91c1c}.btn.danger:hover{background:#dc2626;color:#fff}
  .btn-sm{padding:4px 9px;font-size:11.5px;border-radius:6px;border:0;cursor:pointer;background:#f1f5f9;color:#334155;font-weight:600}
  .btn-sm:hover{background:#e2e8f0}
  .btn-sm.danger{background:#fee2e2;color:#b91c1c}
  .pill{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.2px}
  .pill.ok{background:#dcfce7;color:#15803d}
  .pill.warn{background:#fef3c7;color:#b45309}
  .pill.bad{background:#fee2e2;color:#b91c1c}
  .pill.info{background:#e0f2fe;color:#0369a1}
  .pill.gray{background:#f1f5f9;color:#475569}
  .inp,select.inp,textarea.inp{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
  .inp:focus{outline:2px solid #bae6fd;border-color:var(--brand)}
  label.fl{display:block;font-size:11.5px;font-weight:700;color:#475569;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  .field{margin-bottom:13px}
  .row{display:flex;gap:12px}.row>*{flex:1}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  .search{max-width:280px}
  #modalRoot{position:fixed;inset:0;display:none;background:rgba(15,23,42,.55);z-index:100;padding:26px;overflow-y:auto}
  #modalRoot.on{display:block}
  .modal{background:#fff;border-radius:12px;max-width:820px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .16s ease}
  .modal.wide{max-width:1050px}
  .modal.slim{max-width:520px}
  @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .modal-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-h h3{margin:0;font-size:15px}
  .modal-b{padding:20px}
  .modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#f8fafc;border-radius:0 0 12px 12px}
  .x{background:none;border:0;font-size:20px;cursor:pointer;color:#94a3b8;line-height:1}
  .x:hover{color:#0f172a}
  .pos-wrap{display:grid;grid-template-columns:1fr 380px;gap:16px}
  @media(max-width:1000px){.pos-wrap{grid-template-columns:1fr}}
  .pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .pos-item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer;transition:.12s}
  .pos-item:hover{border-color:var(--brand);box-shadow:0 3px 12px rgba(14,165,233,.16);transform:translateY(-1px)}
  .pos-item .nm{font-weight:650;font-size:12.5px;line-height:1.3;margin-bottom:4px}
  .pos-item .sk{font-size:10.5px;color:var(--muted)}
  .pos-item .pr{font-weight:700;color:#0284c7;margin-top:7px;font-size:13.5px}
  .pos-item .st{font-size:10.5px;color:var(--muted);margin-top:2px}
  .cart-line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f1f5f9}
  .cart-line .nm{flex:1;font-size:12.5px;font-weight:600;line-height:1.25}
  .qtybtn{width:22px;height:22px;border-radius:5px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:700;line-height:1;color:#334155}
  .qtybtn:hover{background:#f1f5f9}
  .totals{border-top:2px solid var(--line);margin-top:10px;padding-top:10px}
  .totals .tr{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
  .totals .tr.big{font-size:17px;font-weight:800;padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
  .bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding:8px 4px 0}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
  .bar .b{width:100%;max-width:46px;background:linear-gradient(180deg,#38bdf8,#0284c7);border-radius:5px 5px 0 0;min-height:3px;transition:.4s}
  .bar .lb{font-size:10.5px;color:var(--muted);font-weight:600}
  .bar .vl{font-size:10px;color:#0284c7;font-weight:700}
  #toast{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:8px}
  .toast{background:#0f172a;color:#f8fafc;padding:11px 17px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s}
  .toast.ok{background:#15803d}.toast.bad{background:#b91c1c}
  .empty{text-align:center;padding:36px;color:var(--muted);font-size:13px}
  .muted{color:var(--muted)}
  .mono{font-variant-numeric:tabular-nums}
  .sec-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#475569;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .sec-title:first-child{margin-top:0}
  .stmnt{font-size:13px}
  .stmnt .li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted #e2e8f0}
  .stmnt .li.total{font-weight:800;border-top:2px solid var(--line);border-bottom:0;margin-top:6px;padding-top:9px;font-size:14px}
  .stmnt .li.head{font-weight:800;background:#f8fafc;padding:7px 10px;border-radius:5px;border:0;margin-top:4px}
  @media print{.sidebar,header.topbar,.toolbar,.btn,#aiFab{display:none!important}#view{padding:0}}
  .chat-wrap{display:grid;grid-template-columns:1fr 300px;gap:16px;height:calc(100vh - 132px);min-height:560px}
  @media(max-width:1000px){.chat-wrap{grid-template-columns:1fr;height:auto}}
  .chat-panel{display:flex;flex-direction:column;overflow:hidden}
  .chat-panel .card-h{background:linear-gradient(90deg,#0b1220,#0f172a);color:#f8fafc;border:0}
  .chat-panel .card-h h3{color:#f8fafc}
  .quick-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f8fafc}
  .chip{font-size:11.5px;padding:5px 10px;background:#fff;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-weight:600;color:#334155;transition:.15s}
  .chip:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chat-log{flex:1;overflow-y:auto;padding:16px;background:#fafbfc}
  .msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
  .msg.user{flex-direction:row-reverse}
  .msg .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0}
  .msg.ai .avatar{background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#04121f}
  .msg.user .avatar{background:#0f172a;color:#fff}
  .msg .bubble{max-width:80%;padding:11px 15px;border-radius:13px;font-size:13px;line-height:1.55;white-space:normal;word-wrap:break-word}
  .msg.ai .bubble{background:#fff;border:1px solid var(--line);border-radius:3px 13px 13px 13px}
  .msg.user .bubble{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border-radius:13px 3px 13px 13px}
  .msg .bubble b{color:#0284c7}
  .msg.user .bubble b{color:#fff}
  .msg-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;padding-top:9px;border-top:1px dashed #e2e8f0}
  .msg-actions button{font-size:11.5px;padding:5px 10px;border-radius:6px;border:1px solid var(--brand);background:#fff;color:var(--brand-2);cursor:pointer;font-weight:600}
  .msg-actions button:hover{background:var(--brand);color:#fff}
  .chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
  .chat-input textarea{flex:1;resize:none;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font-family:inherit;font-size:13px;max-height:120px}
  .chat-input textarea:focus{outline:2px solid #bae6fd;border-color:var(--brand)}
  .chat-input .send{padding:0 18px;border:0;background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#04121f;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer}
  .chat-input .send:disabled{opacity:.5;cursor:not-allowed}
  .typing span{display:inline-block;width:6px;height:6px;background:#94a3b8;border-radius:50%;margin:0 2px;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .insight{padding:10px 12px;background:#fffbeb;border-left:3px solid #f59e0b;border-radius:6px;margin-bottom:9px;font-size:12.5px;line-height:1.45;cursor:pointer;transition:.15s}
  .insight:hover{background:#fef3c7}
  .insight .t{font-weight:700;color:#92400e}
  .insight.bad{background:#fef2f2;border-color:#dc2626}
  .insight.bad .t{color:#991b1b}
  .insight.ok{background:#f0fdf4;border-color:#16a34a}
  .insight.ok .t{color:#166534}
  #aiFab{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#04121f;font-size:24px;cursor:pointer;box-shadow:0 8px 24px rgba(14,165,233,.45);z-index:90;transition:.2s;display:grid;place-items:center}
  #aiFab:hover{transform:scale(1.08)}
  #aiFab.hidden{display:none}
  .ai-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:linear-gradient(135deg,#0ea5e9,#22c55e);color:#04121f;font-size:10.5px;font-weight:800;letter-spacing:.3px}
  .ai-badge .dot{width:6px;height:6px;border-radius:50%;background:#04121f}

  #mobileNav{display:none}
  @media(max-width:780px){
    #mobileNav{display:block;margin:12px auto;width:calc(100% - 24px)}
    main{min-width:0}
    #view .card{min-width:0;overflow-x:auto}
    .topbar .meta{display:none}
    .modal-b{overflow-x:auto}
  }
  .metric-drill{display:block;width:100%;text-align:left;background:var(--panel);color:inherit;font:inherit;cursor:pointer}
  .metric-drill:hover,.metric-drill:focus-visible{border-color:#0284c7;outline:2px solid #0284c7;outline-offset:1px}
  .performance-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .performance-tabs [aria-pressed="true"]{background:#0c4a6e;color:white}
  .metric-drill .card-b{display:block}
  .guide-trigger{width:22px;height:22px;border:1px solid #94a3b8;border-radius:50%;background:#f0f9ff;color:#075985;font:bold 12px system-ui;cursor:pointer;vertical-align:middle;margin-left:6px;padding:0}
  .guide-trigger:hover,.guide-trigger:focus-visible{outline:2px solid #0284c7;outline-offset:2px}
  .guided-metric{position:relative;display:grid;min-width:0}
  .guided-metric .metric-drill{padding-right:28px}
  .guided-metric>.guide-trigger{position:absolute;right:9px;top:9px}
  #platformGuide{position:fixed;inset:auto;margin:0;z-index:3000;max-width:calc(100vw - 16px);width:320px;background:#0f2940;color:#f8fafc;border:1px solid #32516c;border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px #0f172a45}
  #platformGuide[hidden]{display:none}
  #platformGuide p{margin:6px 0 0;line-height:1.5}
  #platformGuideClose{float:right;background:transparent;border:0;color:inherit;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">IB</div>
      <div><h1>IslandBuild ERP</h1><span id="brandSub">St. Lucia · XCD</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main>
    <header class="topbar">
      <div style="display:flex;align-items:center"><h2 id="pageTitle">Dashboard</h2><span id="pageGuide"></span></div>
      <div class="meta">
        <span class="ai-badge"><span class="dot"></span>AI Accountant</span>
        <span id="coName">IslandBuild Construction & Equipment Ltd</span>
        <span id="todayLbl"></span>
        <span id="sampleAccess"></span>
      </div>
    </header>
    <select class="inp" id="mobileNav" aria-label="Navigate to module" onchange="go(this.value)"></select>
    <div id="view"></div>
  </main>
</div>
<button id="aiFab" onclick="go('ai')" title="Ask the AI Accountant">🤖</button>
<div id="modalRoot"></div>
<div id="platformGuide" popover="manual" role="region" aria-labelledby="platformGuideTitle" hidden>
  <button id="platformGuideClose" type="button" aria-label="Close help" onclick="dismissGuide()">×</button>
  <strong id="platformGuideTitle"></strong><p id="platformGuideText"></p>
</div>
<div id="toast"></div>

<script>
/* ==========================================================================
   ISLANDBUILD ERP — Single-file accounting + rental ERP + DeepSeek AI
   ========================================================================== */
const DEMO_WORKSPACE = /(?:^|[?&])demo=1(?:&|$)/.test(window.location?.search || '');
const DB_KEY = DEMO_WORKSPACE ? 'islandbuild_erp_sample_workspace_v1' : 'islandbuild_erp_v1';
let db = null;
let route = 'dashboard';
const ui = { cart: [], posFilter: '', search: {}, aiPending: null };

const uid = () => Math.random().toString(36).slice(2, 10);
const pad = (n, l) => String(n).padStart(l, '0');
const today = () => new Date().toISOString().slice(0, 10);
const dayShift = d => { const x = new Date(); x.setDate(x.getDate() + d); return x.toISOString().slice(0, 10); };
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const money = n => 'EC$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const short = n => 'EC$' + (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 0 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const daysBetween = (a, b) => Math.max(0, Math.ceil((new Date(b) - new Date(a)) / 86400000));

let transactionDepth = 0;
let savedSnapshot;
function save() {
  if (transactionDepth) return;
  const current = localStorage.getItem(DB_KEY);
  requireValue(savedSnapshot === undefined || current === savedSnapshot,
    'Data changed in another tab. Reload this page before saving.');
  const snapshot = JSON.stringify(db);
  localStorage.setItem(DB_KEY, snapshot);
  savedSnapshot = snapshot;
}
function requireValue(condition, message) { if (!condition) throw new Error(message); }
function atomic(action) {
  if (transactionDepth) return action();
  const before = JSON.stringify(db);
  transactionDepth++;
  try {
    const result = action();
    transactionDepth--;
    save();
    return result;
  } catch (error) {
    transactionDepth = 0;
    db = JSON.parse(before);
    throw error;
  }
}
function validDate(date) {
  return /^\d{4}-\d{2}-\d{2}$/.test(date) && Number.isFinite(Date.parse(date)) &&
    new Date(date).toISOString().slice(0, 10) === date;
}
function checkLines(lines) {
  requireValue(lines.length && lines.every(l => l.desc && Number.isFinite(l.qty) && l.qty > 0 &&
    Number.isFinite(l.rate) && l.rate >= 0), 'Enter a description, positive quantity and valid rate on each line.');
}
function checkDocument(opt, parties, partyId) {
  requireValue(parties.some(p => p.id === partyId), 'Choose an existing customer or vendor.');
  requireValue(validDate(opt.date) && validDate(opt.dueDate) && opt.dueDate >= opt.date,
    'Enter valid document and due dates in order.');
  requireValue(!opt.projectId || (db.projects || []).some(p => p.id === opt.projectId), 'Choose an existing project.');
  checkLines(opt.lines);
}
window.addEventListener('error', event => {
  if (event.error) toast(event.error.message, 'bad');
});

function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function nextNo(prefix, key) { if(!db.counters) db.counters = {}; db.counters[key] = (db.counters[key] || 0) + 1; return prefix + pad(db.counters[key], 5); }
function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function nvalFrom(el) { return el.value === '' ? NaN : Number(el.value); }
function nval(id) { return num(val(id)); }

function post(date, memo, ref, source, lines) {
  const clean = lines.filter(l => num(l.debit) || num(l.credit)).map(l => ({ code: l.code, debit: r2(l.debit || 0), credit: r2(l.credit || 0) }));
  if (!clean.length) return null;
  requireValue(validDate(date), 'Enter a valid posting date.');
  requireValue(clean.every(l => account(l.code) && l.debit >= 0 && l.credit >= 0 && !(l.debit && l.credit)),

function acctBalance(code, asOf) {
  const acc = account(code);

  return r2(normalDebit ? dr - cr : cr - dr);

const HSL_ACCOUNT = '2115';
function salesTaxes(lines, vatRate = db.company.vatRate) {
  const hslRate = db.company.hslEnabled === true ? (db.company.hslRate ?? 2.5) : 0;
  const hslInVat = db.company.hslInVat !== false;
  let subtotal = 0, taxable = 0, levyBase = 0;
  for (const line of lines) {
    const cents = Math.round(r2(line.qty * line.rate) * 100);
    subtotal += cents;
    if (line.taxable === false) continue;
    taxable += cents;
    if (line.hslEligible === true) levyBase += cents;
  }
  const percent = (cents, rate) => Math.round(cents * Math.round(rate * 100) / 10000);
  const levy = percent(levyBase, hslRate);
  const vatBase = taxable + (hslInVat ? levy : 0);
  const vat = percent(vatBase, vatRate);
  return {subtotal:subtotal/100, hsl:levy/100, vatBase:vatBase/100,
    vat:vat/100, total:(subtotal+levy+vat)/100, vatRate, hslRate, hslInVat};
}
function ensureHslAccount() {
  if (!account(HSL_ACCOUNT)) db.accounts.push({code:HSL_ACCOUNT,name:'Health & Security Levy Payable',type:'Liability'});
  requireValue(account(HSL_ACCOUNT).type === 'Liability' && account(HSL_ACCOUNT).name === 'Health & Security Levy Payable',
    'Account 2115 is reserved for Health & Security Levy Payable.');
}
function invoiceTaxRows(inv, attrs = '', withIds = false) {
  if (inv.source==='Retention Release')
    return `<div ${attrs}><span>Retention now payable</span><strong>${money(inv.total)}</strong></div>
      <p>Retention was withheld on previously billed work. No additional VAT or HSL is charged on this release.</p>`;
  const fields = [
    ['Subtotal', 'subtotal', 'invSub'],
    [inv.hslRate ? 'HSL @ '+inv.hslRate+'%' : 'HSL', 'hsl', 'invHsl'],
    ['Total for VAT', 'vatBase', 'invVatBase'],
    [inv.vatRate === undefined ? 'VAT' : 'VAT @ '+inv.vatRate+'%', 'vat', 'invVat'],
    ['Total Invoice', 'total', 'invTotal']
  ];
  return fields.filter(([,key])=>key!=='vatBase' || inv.vatBase !== undefined)
    .map(([label,key,id])=>`<div ${attrs} ${key==='total'?'class="big"':''}><span>${label}</span><strong ${withIds?'id="'+id+'"':''}>${money(inv[key]||0)}</strong></div>`).join('');
}
function createInvoice(opt) {
  checkDocument(opt, db.customers, opt.customerId);
  const demand = new Map();
  for (const line of opt.lines) {
    if (!line.itemId) continue;
    const item = db.items.find(i => i.id === line.itemId);
    requireValue(item && (item.type !== 'Rental' || opt.source === 'Rental'), 'Use Rental Agreements to issue equipment.');
    if (item.type !== 'Inventory') continue;
    demand.set(item.id, r2((demand.get(item.id) || 0) + line.qty));
    requireValue(demand.get(item.id) <= item.qty, 'Insufficient stock for ' + item.name);
    line.cost = item.cost;
  }
  const project = (db.projects || []).find(p => p.id === opt.projectId);
  requireValue(!project || project.customerId === opt.customerId, 'Choose the customer assigned to this project.');
  const certified = ['Construction Progress','Construction Final'].includes(opt.source);
  requireValue(!project?.contract || certified, 'Post certified work from the project’s Contract lifecycle panel.');
  const vatRate = opt.vatRate !== undefined ? opt.vatRate : db.company.vatRate;
  const inv = { id: nextNo('INV-', 'inv'), customerId: opt.customerId, date: opt.date || today(),
    dueDate: opt.dueDate || opt.date || today(), lines: opt.lines.map(l => ({ ...l })),
    subtotal: 0, vat: 0, total: 0, paid: 0, status: 'Open', source: opt.source || 'AR',
    projectId: opt.projectId || '', certificateRef: opt.certificateRef, milestoneId: opt.milestoneId, notes: opt.notes || '', rentalId: opt.rentalId || null };
  inv.lines.forEach(l => { l.amount = r2(l.qty * l.rate); });
  Object.assign(inv, salesTaxes(inv.lines, vatRate));
  const debitAcct = opt.paidNow ? (opt.payAccount || '1000') : '1100';
  const retention = opt.retentionHeld ?? 0;
  requireValue(Number.isFinite(retention) && retention>=0 && retention<=inv.subtotal && (!retention || certified && !opt.paidNow),
    'Invalid construction retention amount.');
  inv.retentionHeld = retention;
  const glLines = [{code:debitAcct,debit:r2(inv.total-retention)}];
  if (retention) {
    if (!account(RETENTION_ACCOUNT)) db.accounts.push({code:RETENTION_ACCOUNT,name:'Construction Retention Receivable',type:'Asset'});
    const control = account(RETENTION_ACCOUNT);
    requireValue(control.type==='Asset' && control.name==='Construction Retention Receivable',
      'Account 1110 must be Construction Retention Receivable (Asset).');
    glLines.push({code:RETENTION_ACCOUNT,debit:retention});
  }
  const revTotals = {};
  inv.lines.forEach(l => { const acct = l.revAcct || '4010'; revTotals[acct] = (revTotals[acct] || 0) + l.amount; });
  Object.entries(revTotals).forEach(([acct, amt]) => glLines.push({ code: acct, credit: r2(amt) }));
  if (inv.hsl > 0) {
    ensureHslAccount();
    glLines.push({code:HSL_ACCOUNT,credit:inv.hsl});
  }
  if (inv.vat > 0) glLines.push({ code: '2100', credit: inv.vat });
  post(inv.date, `Sales invoice ${inv.id} — ${customerName(inv.customerId)}`, inv.id, 'Sales', glLines);
  inv.lines.forEach(l => {
    if (!l.itemId) return;
    const item = db.items.find(i => i.id === l.itemId);
    if (!item) return;
    if (item.type === 'Inventory') {
      const value = stockValue(item);
      const cost = l.qty === item.qty ? value : Math.min(value, r2(item.cost * l.qty));
      item.qty = r2(item.qty - l.qty);
      item.stockValue = r2(value - cost);
      item.cost = item.qty ? item.stockValue / item.qty : 0;
      if (cost > 0) post(inv.date, `COGS — ${inv.id} — ${item.name}`, inv.id, 'COGS',
        [{ code: item.cogsAcct || '5000', debit: cost }, { code: '1200', credit: cost }]);
    }
  });
  if (opt.paidNow) inv.paid = inv.total;
  if (!invoiceDue(inv)) inv.status = retention ? 'Retention withheld' : 'Paid';
  if (opt.paidNow && inv.total > 0) db.payments.push({
    id: nextNo('RCP-', 'pay'), type: 'received', partyId: inv.customerId, date: inv.date,
    amount: inv.total, method: debitAcct === '1000' ? 'Cash' : 'Card / Bank Transfer', account: debitAcct, ref: inv.id
  });
  if(!db.invoices) db.invoices = [];
  db.invoices.push(inv); save(); return inv;
}
function payInvoice(id, amount, date, account, method) {
  const inv = db.invoices.find(i => i.id === id); if (!inv) return;
  requireValue(validDate(date) && date >= inv.date, 'Payment date must be on or after the document date.');
  requireValue(amount > 0 && amount <= invoiceDue(inv), 'Enter a positive payment up to the outstanding balance.');
  amount = r2(amount);
  if (amount <= 0) return toast('Nothing left to pay on this invoice', 'bad');
  account = account || '1010';
  inv.paid = r2(inv.paid + amount);
  inv.status = invoiceDue(inv) ? 'Partial' : inv.retentionHeld ? 'Retention withheld' : 'Paid';
  post(date || today(), `Payment received — ${inv.id}`, inv.id, 'Receipt',
    [{ code: account, debit: amount }, { code: '1100', credit: amount }]);
  if(!db.payments) db.payments = [];
  db.payments.push({ id: nextNo('RCP-', 'pay'), type: 'received', partyId: inv.customerId,
    date: date || today(), amount, method: method || 'Bank Transfer', account, ref: inv.id });
  save(); toast('Payment recorded — ' + inv.id, 'ok');
}

  const bill = { id: nextNo('BILL-', 'bill'), vendorId: opt.vendorId, date: opt.date || today(),
    dueDate: opt.dueDate || opt.date || today(), lines: opt.lines.map(l => ({ ...l })),
    subtotal: 0, vat: 0, total: 0, paid: 0, status: 'Open', projectId: opt.projectId || '', notes: opt.notes || '' };
  let sub = 0, vat = 0;
  bill.lines.forEach(l => { l.amount = r2(l.qty * l.rate); sub += l.amount; if (l.taxable !== false) vat += l.amount * (vatRate / 100); });
  bill.subtotal = r2(sub); bill.vat = r2(vat); bill.total = r2(bill.subtotal + bill.vat);
  if (!bill.total) bill.status = 'Paid';
  const glLines = [];
  bill.lines.forEach(l => glLines.push({ code: l.acct || '6900', debit: l.amount }));
  if (bill.vat > 0) glLines.push({ code: '2100', debit: bill.vat });
  glLines.push({ code: '2000', credit: bill.total });
  post(bill.date, `Purchase bill ${bill.id} — ${vendorName(bill.vendorId)}`, bill.id, 'Purchase', glLines);
  bill.lines.forEach(l => { if (!l.itemId) return; const item = db.items.find(i => i.id === l.itemId); if (item && item.type === 'Inventory') {
    item.stockValue = r2(stockValue(item) + l.amount);
    item.qty = r2(item.qty + l.qty);
    item.cost = item.qty ? item.stockValue / item.qty : 0;
  } });
  if(!db.bills) db.bills = [];
  db.bills.push(bill); save(); return bill;
}
function payBill(id, amount, date, account) {
  const bill = db.bills.find(b => b.id === id); if (!bill) return;
  requireValue(validDate(date) && date >= bill.date, 'Payment date must be on or after the document date.');
  requireValue(amount > 0 && amount <= r2(bill.total - bill.paid), 'Enter a positive payment up to the outstanding balance.');
  amount = r2(amount);
  if (amount <= 0) return toast('Nothing left to pay', 'bad');
  account = account || '1010';
  bill.paid = r2(bill.paid + amount);
  bill.status = bill.paid >= bill.total - 0.005 ? 'Paid' : 'Partial';
  post(date || today(), `Payment made — ${bill.id}`, bill.id, 'Disbursement',
    [{ code: '2000', debit: amount }, { code: account, credit: amount }]);
  if(!db.payments) db.payments = [];
  db.payments.push({ id: nextNo('PAY-', 'pay'), type: 'made', partyId: bill.vendorId,
    date: date || today(), amount, method: 'Bank Transfer', account, ref: bill.id });
  save(); toast('Bill payment recorded — ' + bill.id, 'ok');
}
function stockValue(item) { return item.stockValue ?? r2(item.cost * item.qty); }
function rentalRate(item, days) {
  const month = item.monthRate ? Math.floor(days / 30) : 0;
  const remaining = days - month * 30;
  const week = item.weekRate ? Math.floor(remaining / 7) : 0;
  return r2(month * (item.monthRate || 0) + week * (item.weekRate || 0) + (remaining - week * 7) * item.dayRate);
}
function createRental(opt) {
  requireValue(db.customers.some(c => c.id === opt.customerId), 'Choose a rental customer.');
  requireValue(validDate(opt.dateOut) && opt.dateOut <= today() && Number.isInteger(opt.days) &&
    opt.days > 0 && opt.days <= 3650, 'Enter a checkout date through today and 1–3650 whole rental days.');
  requireValue(opt.lines.length, 'Add at least one equipment line.');
  const demand = new Map();
  for (const line of opt.lines) {
    const item = db.items.find(i => i.id === line.itemId);
    requireValue(item?.type === 'Rental' && Number.isInteger(line.qty) && line.qty > 0, 'Choose equipment and a positive whole quantity.');
    demand.set(item.id, (demand.get(item.id) || 0) + line.qty);
    requireValue(demand.get(item.id) <= item.qty - (item.onRent || 0), 'Insufficient availability for ' + item.name);
  }
  const dateOut = opt.dateOut || today();
  const days = Math.max(1, opt.days || 1);
  const dueDate = new Date(dateOut); dueDate.setUTCDate(dueDate.getUTCDate() + days);
  const lines = opt.lines.map(l => {
    const item = db.items.find(i => i.id === l.itemId);
    return { itemId: l.itemId, qty: l.qty, dayRate: item ? item.dayRate : 0, weekRate: item ? item.weekRate : 0,
      monthRate: item ? item.monthRate : 0, deposit: item ? item.deposit : 0 };
  });
  const deposit = r2(lines.reduce((s, l) => s + l.deposit * l.qty, 0));
  const rnt = { id: nextNo('RNT-', 'rnt'), customerId: opt.customerId, dateOut,
    dueDate: dueDate.toISOString().slice(0, 10), dateIn: null, days, lines, deposit,
    depositPaid: deposit, depositAccount: opt.depositAccount || '1000', lateFeePct: db.company.lateFeePct, status: 'Out', charges: null, invoiceId: null, notes: opt.notes || '' };
  lines.forEach(l => { const item = db.items.find(i => i.id === l.itemId); if (item) item.onRent = (item.onRent || 0) + l.qty; });
  if (deposit > 0) post(dateOut, `Rental deposit received — ${rnt.id}`, rnt.id, 'Deposit',
    [{ code: opt.depositAccount || '1000', debit: deposit }, { code: '2200', credit: deposit }]);
  if(!db.rentals) db.rentals = [];
  db.rentals.push(rnt); save(); return rnt;
}
function returnRental(id, opt) {
  const rnt = db.rentals.find(r => r.id === id); if (!rnt) return;
  requireValue(rnt.status === 'Out', 'This equipment has already been checked in.');
  requireValue(validDate(opt.dateIn) && opt.dateIn >= rnt.dateOut && opt.dateIn <= today(), 'Return date must be between checkout and today.');
  requireValue(Number.isFinite(opt.damage) && opt.damage >= 0, 'Damage charges must be nonnegative.');
  const dateIn = opt.dateIn;
  const damage = r2(opt.damage || 0);
  rnt.lines.forEach(l => { const item = db.items.find(i => i.id === l.itemId); if (item) item.onRent = Math.max(0, (item.onRent || 0) - l.qty); });
  const usedDays = Math.max(1, daysBetween(rnt.dateOut, dateIn));
  const lateDays = Math.max(0, daysBetween(rnt.dueDate, dateIn));
  let rentalCharge = 0; const invLines = [];
  rnt.lines.forEach(l => {
    const item = db.items.find(i => i.id === l.itemId);
    const rate = rentalRate(l, usedDays);
    rentalCharge += r2(rate * l.qty);
    invLines.push({ itemId: l.itemId, desc: `${item ? item.name : 'Equipment'} — ${usedDays} day(s), contracted rate`,
      qty: l.qty, rate, taxable: item?.taxable !== false, hslEligible: item?.hslEligible === true, revAcct: '4020', cogsAcct: '6200', cost: 0 });
  });
  let lateFee = 0;
  const latePct = rnt.lateFeePct ?? db.company.lateFeePct;
  if (lateDays > 0) {
    lateFee = r2(rentalCharge * (latePct / 100) * lateDays);
    invLines.push({ itemId: '', desc: `Late return fee — ${lateDays} day(s) @ ${latePct}%`, qty: 1, rate: lateFee, taxable: true, revAcct: '4030', cogsAcct: '6200', cost: 0 });
  }
  if (damage > 0) invLines.push({ itemId: '', desc: 'Damage / cleaning recovery', qty: 1, rate: damage, taxable: true, revAcct: '4030', cogsAcct: '6200', cost: 0 });
  const inv = createInvoice({ customerId: rnt.customerId, date: dateIn, dueDate: dateIn, lines: invLines, source: 'Rental', rentalId: rnt.id });
  const applied = r2(Math.min(rnt.depositPaid, inv.total));
  if (applied > 0) {
    post(dateIn, `Rental deposit applied — ${rnt.id}`, rnt.id, 'Deposit',
      [{ code: '2200', debit: applied }, { code: '1100', credit: applied }]);
    inv.paid = r2(inv.paid + applied);
    inv.status = inv.paid >= inv.total - 0.005 ? 'Paid' : 'Partial';
  }
  const excess = r2(rnt.depositPaid - applied);
  if (excess > 0) post(dateIn, `Rental deposit refund — ${rnt.id}`, rnt.id, 'Refund',
    [{ code: '2200', debit: excess }, { code: rnt.depositAccount || '1000', credit: excess }]);
  if (opt.payBalance && inv.paid < inv.total) payInvoice(inv.id, r2(inv.total - inv.paid), dateIn, '1000', 'Cash');
  rnt.status = 'Returned'; rnt.dateIn = dateIn; rnt.invoiceId = inv.id;
  rnt.charges = { days: usedDays, lateDays, rental: r2(rentalCharge), late: lateFee, damage,
    total: inv.total, depositApplied: applied, refunded: excess };
  save(); toast('Equipment checked in — invoice ' + inv.id, 'ok');
  return inv;
}

const customerName = id => (db.customers.find(c => c.id === id) || {}).name || '—';
const vendorName = id => (db.vendors.find(v => v.id === id) || {}).name || '—';
const itemName = id => (db.items.find(i => i.id === id) || {}).name || '—';
function invoiceDue(inv) { return r2(inv.total - inv.paid - (inv.retentionHeld || 0)); }
function billDue(b) { return r2(b.total - b.paid); }

function posAdd(id) {

  if (item.type === 'Inventory' && item.qty <= 0) return toast('Out of stock', 'bad');
  const existing = ui.cart.find(l => l.itemId === id);
  if (existing) existing.qty++;
  else ui.cart.push({ itemId: item.id, name: item.name, qty: 1, rate: item.price, taxable: item.taxable, hslEligible: item.hslEligible === true, revAcct: item.revAcct, cogsAcct: item.cogsAcct, cost: item.cost });

}
function posQty(idx, delta) { const l = ui.cart[idx]; if (!l) return; l.qty += delta; if (l.qty <= 0) ui.cart.splice(idx, 1); render(); }
function posCheckout() {
  if (!ui.cart.length) return;
  const customerId = val('posCustomer');
  const tot = cartTotal();
  openModal('Take Payment', `
    <div class="field"><label class="fl">Amount Tendered</label><input class="inp" id="posTender" type="number" step="0.01" value="${tot}"></div>

}
function cartTotal() { return salesTaxes(ui.cart).total; }
function posFinalize(customerId) {
  requireValue(nval('posTender') >= cartTotal(), 'Amount tendered is below the sale total.');
  const change = r2(nval('posTender') - cartTotal());
  requireValue(val('posMethod') === '1000' || !change, 'Enter the exact amount for card or bank payments.');
  const acct = val('posMethod') || '1000';

function advanceInvoice() {
  const customer = db.customers.find(c => c.id === val('invCustomer'));
  const date = val('invDate');
  const dueDate = val('invDue');
  const projectId = val('invProject');
  const project = (db.projects || []).find(p => p.id === projectId);
  const detailsIssue = (message, id) => invoiceIssue(1, message, document.getElementById(id));
  if (!customer) return detailsIssue('Choose the customer who will receive this invoice.', 'invCustomer');
  if (!validDate(date)) return detailsIssue('Enter a valid invoice date.', 'invDate');
  if (!validDate(dueDate) || dueDate < date)
    return detailsIssue('Enter a due date on or after the invoice date.', 'invDue');
  if (projectId && project?.customerId !== customer.id)
    return detailsIssue('Choose a project for this customer, or select No project if this sale is unrelated.', 'invProject');
  if (project?.contract)
    return detailsIssue('Open this project’s Contract lifecycle panel to bill certified work.', 'invProject');
  if (invoiceStep === 1) return showInvoiceStep(2);

  const lines = [];
  const demand = new Map();
  const rows = [...document.querySelectorAll('#invLines tr')];
  if (!rows.length) return invoiceIssue(2, 'Select Add Line and enter at least one charge.');
  for (const [index, row] of rows.entries()) {
    const field = name => row.querySelector('.line-' + name);
    const issue = (message, name) => invoiceIssue(2, 'Line ' + (index + 1) + '. ' + message, field(name));
    const itemId = field('item').value;
    const item = db.items.find(i => i.id === itemId);
    const desc = field('desc').value.trim();
    const qty = field('qty').valueAsNumber;
    const rate = field('rate').valueAsNumber;
    if (itemId && !item) return issue('Choose an available item.', 'item');
    if (item?.type === 'Rental') return issue('Use Rental Agreements to bill this equipment.', 'item');
    if (!desc) return issue('Enter what you are charging for, or remove this line.', 'desc');
    if (!Number.isFinite(qty) || qty <= 0) return issue('Enter a quantity greater than zero.', 'qty');
    if (!Number.isFinite(rate) || rate < 0 || !Number.isFinite(qty * rate))
      return issue('Enter a valid unit price of zero or more.', 'rate');
    if (item?.type === 'Inventory') {
      const requested = r2((demand.get(itemId) || 0) + qty);
      if (requested > item.qty)
        return issue('Reduce the combined quantity for ' + item.name + ' to the available stock of ' + item.qty + '.', 'qty');
      demand.set(itemId, requested);
    }
    lines.push({itemId, desc, qty, rate, taxable:field('vat').checked, hslEligible:field('hsl').checked,
      revAcct:item?.revAcct || '4010', cogsAcct:item?.cogsAcct || '5000', cost:item?.cost || 0});
  }
  if (invoiceStep === 2) {
    document.getElementById('invStep3').innerHTML = `
      <p><strong>${esc(customer.name)}</strong> · ${esc(project?.name || 'No project')}</p>
      <p>Invoice date <strong>${esc(date)}</strong> · Payment due <strong>${esc(dueDate)}</strong></p>
      <div style="overflow-x:auto"><table>
      <thead><tr><th>Description</th><th>Quantity</th><th>Unit price</th><th>VAT</th><th>HSL</th><th>Amount</th></tr></thead>
      <tbody>${lines.map(line => `<tr><td>${esc(line.desc)}</td><td>${line.qty}</td>
        <td>${money(line.rate)}</td><td>${line.taxable ? 'Yes' : 'No'}</td><td>${line.hslEligible ? 'Yes' : 'No'}</td>
        <td>${money(r2(line.qty * line.rate))}</td></tr>`).join('')}</tbody></table></div>
      <div style="margin:16px 0 0 auto;max-width:300px">
        ${invoiceTaxRows(salesTaxes(lines), 'style="display:flex;justify-content:space-between;padding:5px 0"')}
      </div>`;
    return showInvoiceStep(3);
  }

  let invoice;
  try {
    invoice = atomic(() => createInvoice({customerId:customer.id, date, dueDate, projectId, lines, source:'AR'}));
  } catch (error) {
    return invoiceIssue(3, 'Invoice could not be posted. ' + error.message);
  }
  closeModal();
  render();
  toast('Invoice ' + invoice.id + ' posted', 'ok');
}

function billItemChange(select) {
  const tr = select.closest('tr');
  const item = db.items.find(i => i.id === select.value);
  const accountSelect = tr.querySelector('.bl-acct');
  accountSelect.disabled = !!item;
  if (item) {
    accountSelect.value = '1200';
    tr.querySelector('.bl-desc').value = item.name;
    tr.querySelector('.bl-rate').value = r2(item.cost);
    tr.querySelector('.bl-tax').checked = item.taxable !== false;
  } else if (accountSelect.value === '1200') accountSelect.value = '6900';
  recalcBill();

function recalcBill() {
  let sub = 0, vat = 0;
  document.querySelectorAll('#billLines tr').forEach(tr => {
    const amt = r2(num(tr.querySelector('.bl-qty').value) * num(tr.querySelector('.bl-rate').value));
    tr.querySelector('.bl-amt').textContent = money(amt);
    sub += amt; if (tr.querySelector('.bl-tax').checked) vat += amt * db.company.vatRate / 100;
  });
  document.getElementById('billSub').textContent = money(sub);
  document.getElementById('billVat').textContent = money(vat);
  document.getElementById('billTotal').textContent = money(sub + vat);
}
function saveBill() {
  const lines = [];

    const desc = tr.querySelector('.bl-desc').value; const qty = num(tr.querySelector('.bl-qty').value); const rate = num(tr.querySelector('.bl-rate').value);
    if (!desc || qty <= 0) return;
    lines.push({ desc, qty, rate, acct: tr.querySelector('.bl-acct').value, taxable: tr.querySelector('.bl-tax').checked, itemId: tr.querySelector('.bl-item').value });

function toggleRentalFields() { document.getElementById('rentalFields').style.display = document.getElementById('itType').value === 'Rental' ? 'block' : 'none'; }
function saveItem(id) {
  const type = val('itType');
  const data = { sku: val('itSku'), name: val('itName'), category: val('itCat'), type, unit: val('itUnit'), cost: nval('itCost'), price: nval('itPrice'), qty: nval('itQty'), reorder: nval('itReorder'), taxable: val('itTax') === '1', hslEligible: document.getElementById('itHsl').checked, revAcct: val('itRev'), cogsAcct: val('itCogs'), dayRate: nval('itDay'), weekRate: nval('itWeek'), monthRate: nval('itMonth'), deposit: nval('itDep') };
  requireValue(data.name && data.sku, 'Enter an item name and SKU.');
  requireValue(!db.items.some(i => i.id !== id && i.sku.toLowerCase() === data.sku.toLowerCase()), 'SKU already exists.');
  requireValue(['cost','price','qty','reorder','dayRate','weekRate','monthRate','deposit'].every(k =>
    Number.isFinite(data[k]) && data[k] >= 0), 'Quantities, rates and costs must be nonnegative.');
  const existing = db.items.find(i => i.id === id);
  if (existing) {
    requireValue(existing.type === data.type, 'An existing item must retain its original type.');
    if (type === 'Inventory') {
      requireValue(existing.qty === data.qty, 'Use a stock adjustment or vendor bill to change quantity.');
      data.cost = existing.cost;
    }
    if (type === 'Rental') requireValue(Number.isInteger(data.qty) && data.qty >= (existing.onRent || 0),
      'Fleet count must be a whole number at least equal to units rented out.');
  } else if (type === 'Inventory') {
    requireValue(!data.qty, 'Create the item with zero stock, then post a purchase or opening stock adjustment.');
  } else if (type === 'Rental') requireValue(Number.isInteger(data.qty), 'Fleet count must be a whole number.');
  if (existing) Object.assign(existing, data);
  else db.items.push({ id: 'ITM-' + pad(db.items.length + 1, 3) + uid().slice(0, 2), onRent: 0, ...data });
  save(); closeModal(); render(); toast('Item saved', 'ok');
}
function adjustStockModal(id) {
  const i = db.items.find(x => x.id === id);
  openModal('Stock Adjustment — ' + i.name, `
    <div class="field"><label class="fl">Current Quantity</label><input class="inp" value="${i.qty}" disabled></div>
    <div class="row"><div class="field"><label class="fl">Adjustment (+/−)</label><input class="inp" id="adjQty" type="number" step="0.01" value="0"></div>
      <div class="field"><label class="fl">Unit Cost</label><input class="inp" id="adjCost" type="number" step="0.01" value="${i.cost}"></div></div>
    <div class="field"><label class="fl">Reason</label><input class="inp" id="adjNote" placeholder="e.g. damaged, recount"></div>
  `, `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="doAdjust('${id}')">Post Adjustment</button>`, 'slim');
}
function doAdjust(id) {
  const i = db.items.find(x => x.id === id); const qty = nval('adjQty'); const cost = nval('adjCost');
  if (!qty) return toast('Enter non-zero quantity', 'bad');
  requireValue(i.type === 'Inventory' && val('adjNote') && cost >= 0 && r2(i.qty + qty) >= 0,
    'Enter a reason, a valid cost and a quantity that keeps stock nonnegative.');
  const value = stockValue(i);
  const amount = qty < 0 ? (i.qty + qty === 0 ? -value : -Math.min(value, r2(-qty * i.cost))) : r2(qty * cost);
  i.qty = r2(i.qty + qty);
  i.stockValue = r2(value + amount);
  i.cost = i.qty ? i.stockValue / i.qty : 0;
  post(today(), `Stock adjustment — ${i.name} · ${val('adjNote')}`, 'ADJ-' + i.sku, 'Inventory',
    amount >= 0 ? [{ code: '1200', debit: amount }, { code: '5000', credit: amount }] :
      [{ code: '5000', debit: -amount }, { code: '1200', credit: -amount }]);
  save(); closeModal(); render(); toast('Stock adjusted', 'ok');
}

  tr.innerHTML = `<td><select class="inp rl-item" onchange="recalcRental()">
      ${(db.items||[]).filter(i => i.type === 'Rental').map(i => `<option value="${i.id}">${esc(i.name)} — ${money(i.dayRate)}/day · ${i.qty - (i.onRent || 0)} avail</option>`).join('')}

  tb.appendChild(tr); recalcRental();

function recalcRental() {
  let est = 0, dep = 0; const days = num((document.getElementById('rntDays') || {}).value) || 1;
  document.querySelectorAll('#rntLines tr').forEach(tr => {
    const item = db.items.find(i => i.id === tr.querySelector('.rl-item').value);
    const qty = num(tr.querySelector('.rl-qty').value) || 1; if (!item) return;
    tr.querySelector('.rl-dep').textContent = money(item.deposit * qty);
    dep += item.deposit * qty; est += rentalRate(item, days) * qty;
  });
  const e1 = document.getElementById('rntEst'); if (e1) e1.textContent = money(est);
  const e2 = document.getElementById('rntDep'); if (e2) e2.textContent = money(dep);
}
function saveRental() {
  const lines = [];
  document.querySelectorAll('#rntLines tr').forEach(tr => {
    const itemId = tr.querySelector('.rl-item').value; const qty = nvalFrom(tr.querySelector('.rl-qty'));
    if (itemId) lines.push({ itemId, qty });

  if (!lines.length) return toast('Add equipment', 'bad');
  const r = createRental({ customerId: val('rntCustomer'), dateOut: val('rntOut'), days: nvalFrom(document.getElementById('rntDays')), lines, depositAccount: val('rntDepositAccount'), notes: val('rntNotes') });

function saveJournal() {
  const lines = [];
  document.querySelectorAll('#jeLines tr').forEach(tr => { lines.push({ code: tr.querySelector('.je-acct').value, debit: num(tr.querySelector('.je-dr').value), credit: num(tr.querySelector('.je-cr').value) }); });
  const dr = r2(lines.reduce((s, l) => s + l.debit, 0)), cr = r2(lines.reduce((s, l) => s + l.credit, 0));
  if (dr !== cr) return toast('Debits and credits must balance', 'bad');
  if (!dr) return toast('Entry is empty', 'bad');
  requireValue(validDate(val('jeDate')), 'Enter a valid journal date.');
  post(val('jeDate'), val('jeMemo') || 'Manual journal entry', nextNo('JE-', 'je'), 'Journal', lines);
  save(); closeModal(); render(); toast('Journal posted', 'ok');
}
function viewTrial() {
  let tDr = 0, tCr = 0;
  const rows = (db.accounts || []).map(a => {
    let dr = 0, cr = 0;
    (db.gl || []).forEach(e => e.lines.forEach(l => { if (l.code === a.code) { dr += l.debit; cr += l.credit; } }));
    const net = r2(dr - cr); const dCol = net > 0 ? net : 0; const cCol = net < 0 ? -net : 0;
    tDr += dCol; tCr += cCol; return { a, dCol, cCol };
  }).filter(r => r.dCol || r.cCol);

function agingReport(kind) {
  const docs = kind === 'ar'
    ? (db.invoices||[]).filter(i => invoiceDue(i) > 0.005).map(i => ({ party: customerName(i.customerId), due: invoiceDue(i), date: i.dueDate }))
    : (db.bills||[]).filter(b => billDue(b) > 0.005).map(b => ({ party: vendorName(b.vendorId), due: billDue(b), date: b.dueDate }));
  const grouped = {};
  docs.forEach(d => {
    const days = daysBetween(d.date, today());
    const bucket = days <= 30 ? 'Current' : days <= 60 ? '31–60' : days <= 90 ? '61–90' : '90+';
    grouped[d.party] = grouped[d.party] || {};
    grouped[d.party][bucket] = (grouped[d.party][bucket] || 0) + d.due;
    grouped[d.party].total = (grouped[d.party].total || 0) + d.due;
  });
  const cols = ['Current', '31–60', '61–90', '90+'];
  const totals = {}; cols.forEach(c => totals[c] = 0); totals.total = 0;
  Object.values(grouped).forEach(g => { cols.forEach(c => totals[c] += g[c] || 0); totals.total += g.total || 0; });
  return `<div class="card"><div class="card-h"><h3>${kind === 'ar' ? 'AR' : 'AP'} Aging — ${today()}</h3></div>
    <div class="card-b" style="padding:0;overflow-x:auto"><table>
      <thead><tr><th>${kind === 'ar' ? 'Customer' : 'Vendor'}</th>${cols.map(c => `<th class="num">${c}</th>`).join('')}<th class="num">Total</th></tr></thead>
      <tbody>${Object.entries(grouped).map(([p, g]) => `<tr><td><strong>${esc(p)}</strong></td>
        ${cols.map(c => `<td class="num">${g[c] ? money(g[c]) : '—'}</td>`).join('')}
        <td class="num" style="font-weight:700">${money(g.total)}</td></tr>`).join('') || `<tr><td colspan="6" class="empty">Nothing outstanding</td></tr>`}
      <tr style="background:#f8fafc;font-weight:800"><td>TOTAL</td>${cols.map(c => `<td class="num">${money(totals[c])}</td>`).join('')}<td class="num">${money(totals.total)}</td></tr>
      </tbody></table></div></div>`;
}
function salesReport() {
  const byCust = {};
  (db.invoices||[]).forEach(i => {
    byCust[i.customerId] = byCust[i.customerId] || { count: 0, total: 0, paid: 0, due: 0 };
    const customer = byCust[i.customerId];
    if (i.source!=='Retention Release') { customer.count++; customer.total += i.total; }
    customer.paid += i.paid;
    customer.due += invoiceDue(i);
  });
  return `<div class="card"><div class="card-h"><h3>Sales by Customer</h3></div>
    <div class="card-b" style="padding:0"><table>
      <thead><tr><th>Customer</th><th class="num">Invoices</th><th class="num">Invoiced</th><th class="num">Collected</th><th class="num">Outstanding</th></tr></thead>
      <tbody>${Object.entries(byCust).map(([id, v]) => `<tr><td><strong>${esc(customerName(id))}</strong></td>
        <td class="num">${v.count}</td><td class="num">${money(v.total)}</td><td class="num">${money(v.paid)}</td>
        <td class="num" style="font-weight:700">${money(v.due)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function vatReport() {
  const month = (ui.vatMonth || today().slice(0, 7));
  let output = 0, input = 0, hsl = 0;
  (db.gl || []).filter(e => e.date.slice(0, 7) === month && ['Sales', 'Purchase'].includes(e.source)).forEach(e => {
    if (e.source === 'Sales') for (const l of e.lines) if (l.code === HSL_ACCOUNT) hsl += l.credit - l.debit;
    e.lines.filter(l => l.code === '2100').forEach(l => { output += l.credit; input += l.debit; });
  });
  const net = r2(output - input);
  return `<div class="card"><div class="card-h"><h3>Monthly VAT &amp; HSL Ledger Worksheet</h3>
      <input class="inp" type="month" value="${month}" style="width:auto" onchange="ui.vatMonth=this.value;render()"></div>

      <div class="li"><span>VAT on sales (output)</span><span>${money(output)}</span></div>

      <div class="li total"><span>${net >= 0 ? 'NET OUTPUT VAT' : 'NET INPUT VAT'}</span><span>${money(Math.abs(net))}</span></div></div>
      <div class="stmnt" style="max-width:520px"><div class="li"><span>HSL charged on sales (account 2115)</span><span>${money(hsl)}</span></div></div>
      <p class="muted" style="font-size:12px;margin-top:18px">VAT Reg: <strong>${esc(db.company.vatNo)}</strong> · TIN <strong>${esc(db.company.tin)}</strong> · Worksheet for review before filing.</p>

function saveCompany() {
  const hslRate = nvalFrom(document.getElementById('coHslRate'));
  requireValue(Number.isFinite(hslRate) && hslRate >= 0 && hslRate <= 100 && r2(hslRate) === hslRate,
    'Enter an HSL rate between 0 and 100 with up to two decimal places.');
  const hslEnabled = document.getElementById('coHslEnabled').checked;
  if (hslEnabled) ensureHslAccount();
  Object.assign(db.company,{hslRate,hslEnabled,hslInVat:document.getElementById('coHslVat').checked});
  requireValue(val('coName2') && nval('coRate') >= 0 && nval('coRate') <= 100 &&
    nval('coLate') >= 0 && nval('coLate') <= 100, 'Enter a company name and percentage rates from 0 to 100.');
  Object.assign(db.company, { name: val('coName2'), addr: val('coAddr'), phone: val('coPhone'), email: val('coEmail'), tin: val('coTin'), vatNo: val('coVat'), vatRate: nval('coRate'), terms: val('coTerms'), lateFeePct: nval('coLate') });
  save(); render(); toast('Company settings saved', 'ok');
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'islandbuild-backup-' + today() + '.json'; a.click();
  toast('Backup exported', 'ok');
}
function importBackup(input) {
  const f = input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = validateBackup(JSON.parse(e.target.result));
      if (!confirm('Replace this company with the selected backup?')) return;
      atomic(() => { db = data; });
      ui.cart = []; go('dashboard'); toast('Backup restored', 'ok');
    } catch (err) { toast(err.message, 'bad'); }
    finally { input.value = ''; }
  };
  reader.readAsText(f);
}
function resetDemo() {
  if (!confirm('Erase ALL data and reload demo company?')) return;
  atomic(()=>seedDatabase(true)); ui.cart = []; render(); toast('Demo data reloaded', 'ok');
}

    { type: 'function', function: { name: 'list_overdue_invoices', description: 'List customer invoices that are past their due date', parameters: { type: 'object', properties: {} } } },
    { type: 'function', function: { name: 'list_overdue_bills', description: 'List vendor bills that are past their due date', parameters: { type: 'object', properties: {} } } },
    { type: 'function', function: { name: 'list_overdue_rentals', description: 'List rental agreements where equipment is still out past its due date', parameters: { type: 'object', properties: {} } } },
    { type: 'function', function: { name: 'get_ar_aging', description: 'Accounts receivable aging buckets by customer', parameters: { type: 'object', properties: {} } } },
    { type: 'function', function: { name: 'get_ap_aging', description: 'Accounts payable aging buckets by vendor', parameters: { type: 'object', properties: {} } } },
    { type: 'function', function: { name: 'get_top_customers', description: 'Top customers by total invoiced amount', parameters: { type: 'object', properties: { limit: { type: 'number', description: 'default 5' } } } } },
    { type: 'function', function: { name: 'get_vat_position', description: 'VAT payable or refundable for a month', parameters: { type: 'object', properties: { month: { type: 'string', description: 'YYYY-MM, defaults to current' } } } } },
    { type: 'function', function: { name: 'get_inventory_alerts', description: 'Inventory items at or below their reorder point', parameters: { type: 'object', properties: {} } } },
    { type: 'function', function: { name: 'get_rental_status', description: 'Equipment fleet status: utilization, availability, active agreements', parameters: { type: 'object', properties: {} } } },
    { type: 'function', function: { name: 'get_expense_breakdown', description: 'Expense totals by GL account', parameters: { type: 'object', properties: {} } } },
    { type: 'function', function: { name: 'get_monthly_revenue', description: 'Revenue trend for last N months', parameters: { type: 'object', properties: { months: { type: 'number', description: 'default 6' } } } } },
    { type: 'function', function: { name: 'find_duplicates', description: 'Detect potential duplicate invoices or payments', parameters: { type: 'object', properties: {} } } },
    { type: 'function', function: { name: 'get_customer_balance', description: 'Get balance and open invoices for a specific customer by name', parameters: { type: 'object', properties: { customer_name: { type: 'string' } }, required: ['customer_name'] } } }
  ];
}

const aiExec = {
  get_financial_summary: () => {
    const cash = r2(acctBalance('1000') + acctBalance('1010') + acctBalance('1020'));
    const ar = r2((db.invoices || []).reduce((s,i) => s + invoiceDue(i), 0));
    const ap = r2((db.bills || []).reduce((s,b) => s + billDue(b), 0));
    const inventoryValue = r2((db.items || []).filter(i=>i.type==='Inventory').reduce((s,i)=>s+i.qty*i.cost,0));
    const revenue = r2(accountsByType('Revenue').reduce((s,a)=>s+acctBalance(a.code),0));
    const expenses = r2(accountsByType('Expense').reduce((s,a)=>s+acctBalance(a.code),0));
    return { cash, ar, ap, inventoryValue, revenue, expenses, netProfit: r2(revenue - expenses) };
  },
  list_overdue_invoices: () => (db.invoices || [])
    .filter(i => invoiceDue(i) > 0.005 && i.dueDate < today())
    .map(i => ({ id: i.id, customer: customerName(i.customerId), dueDate: i.dueDate, balance: invoiceDue(i), daysLate: daysBetween(i.dueDate, today()) }))
    .sort((a,b) => b.daysLate - a.daysLate),
  list_overdue_bills: () => (db.bills || [])
    .filter(b => billDue(b) > 0.005 && b.dueDate < today())
    .map(b => ({ id: b.id, vendor: vendorName(b.vendorId), dueDate: b.dueDate, balance: billDue(b), daysLate: daysBetween(b.dueDate, today()) }))
    .sort((a,b) => b.daysLate - a.daysLate),
  list_overdue_rentals: () => (db.rentals || [])
    .filter(rentalOverdue)
    .map(r => ({ id: r.id, customer: customerName(r.customerId), dueDate: r.dueDate, daysLate: daysBetween(r.dueDate, today()),
      equipment: r.lines.map(l => `${l.qty}x ${itemName(l.itemId)}`) })),
  get_ar_aging: () => {
    const buckets = { current: 0, d30: 0, d60: 0, d90: 0, total: 0 };
    (db.invoices || []).filter(i => invoiceDue(i) > 0.005).forEach(i => {
      const days = daysBetween(i.dueDate, today()); const bal = invoiceDue(i);
      if (days <= 0) buckets.current += bal; else if (days <= 30) buckets.d30 += bal;
      else if (days <= 60) buckets.d60 += bal; else buckets.d90 += bal;
      buckets.total += bal;
    });
    return buckets;
  },
  get_ap_aging: () => {
    const buckets = { current: 0, d30: 0, d60: 0, d90: 0, total: 0 };
    (db.bills || []).filter(b => billDue(b) > 0.005).forEach(b => {
      const days = daysBetween(b.dueDate, today()); const bal = billDue(b);
      if (days <= 0) buckets.current += bal; else if (days <= 30) buckets.d30 += bal;
      else if (days <= 60) buckets.d60 += bal; else buckets.d90 += bal;
      buckets.total += bal;
    });
    return buckets;
  },
  get_top_customers: (args) => {
    const limit = (args && args.limit) || 5;
    const byCust = {};
    (db.invoices || []).forEach(i => { byCust[i.customerId] = (byCust[i.customerId] || 0) + i.total; });
    return Object.entries(byCust).sort((a,b) => b[1]-a[1]).slice(0, limit)
      .map(([id, total]) => ({ customer: customerName(id), totalInvoiced: r2(total) }));
  },
  get_vat_position: (args) => {
    const month = (args && args.month) || today().slice(0,7);
    let output = 0, input = 0;
    (db.gl || []).filter(e => e.date.slice(0,7) === month).forEach(e => {
      e.lines.filter(l => l.code === '2100').forEach(l => { output += l.credit; input += l.debit; });
    });
    return { month, outputTax: r2(output), inputTax: r2(input), netPayable: r2(output - input), vatRate: db.company.vatRate };
  },
  get_inventory_alerts: () => (db.items || []).filter(i => i.type === 'Inventory' && i.qty <= i.reorder)
    .map(i => ({ name: i.name, sku: i.sku, onHand: i.qty, reorderAt: i.reorder, shortfall: r2(i.reorder - i.qty) })),
  get_rental_status: () => ({
    activeAgreements: (db.rentals || []).filter(r => r.status === 'Out').length,
    overdue: (db.rentals || []).filter(rentalOverdue).length,
    fleet: (db.items || []).filter(i => i.type === 'Rental').map(i => ({
      name: i.name, owned: i.qty, onRent: i.onRent || 0,
      available: i.qty - (i.onRent || 0),
      utilizationPct: i.qty ? Math.round(((i.onRent || 0) / i.qty) * 100) : 0
    })),
    depositsHeld: acctBalance('2200')
  }),
  get_expense_breakdown: () => accountsByType('Expense')
    .map(a => ({ account: a.name, code: a.code, amount: acctBalance(a.code) }))
    .filter(x => x.amount > 0).sort((a,b) => b.amount - a.amount),
  get_monthly_revenue: (args) => {
    const months = (args && args.months) || 6;
    const out = [];
    for (let i = months - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      const key = d.toISOString().slice(0,7);
      const amt = (db.gl || []).filter(e => e.date.slice(0,7) === key)
        .reduce((s,e) => s + e.lines.filter(l => ['4000','4010','4020','4030'].includes(l.code))
          .reduce((a,l) => a + l.credit - l.debit, 0), 0);
      out.push({ month: d.toLocaleDateString('en-GB',{month:'short',year:'numeric'}), revenue: r2(amt) });
    }
    return out;
  },
  find_duplicates: () => {
    const issues = [];
    const seen = {};
    (db.invoices || []).forEach(i => {
      const key = i.customerId + '|' + i.total + '|' + i.date;
      if (seen[key]) issues.push({ type: 'duplicate_invoice', detail: `Possible duplicate: ${i.id} and ${seen[key].id} (${money(i.total)} on ${i.date})` });
      else seen[key] = i;
    });
    return issues;
  },
  get_customer_balance: (args) => {
    const name = (args.customer_name || '').toLowerCase();
    const cust = (db.customers || []).find(c => c.name.toLowerCase().includes(name));
    if (!cust) return { error: 'Customer not found' };
    const openInvoices = (db.invoices || []).filter(i => i.customerId === cust.id && invoiceDue(i) > 0.005)
      .map(i => ({ id: i.id, dueDate: i.dueDate, balance: invoiceDue(i), daysLate: Math.max(0, daysBetween(i.dueDate, today())) }));
    return { customer: cust.name, terms: cust.terms, totalOwed: r2(openInvoices.reduce((s,i)=>s+i.balance,0)), openInvoices };
  }
};

      'EV '+money(e.ev)+' · AC '+money(e.ac)+' · CPI '+reportIndex(e.cpi)+' · SPI '+reportIndex(e.spi)+' · EAC '+reportAmount(e.eac) :

  if (/retention|contract status|construction closeout/i.test(prompt)) {
    const projects=(db.projects||[]).filter(p=>p.contract);

      return p.name+' · '+f.phase+' · '+money(f.remaining)+' unbilled · '+money(f.ordinaryDue)+' invoice balance · '+
        money(f.held)+' retention held · '+money(f.releaseDue)+' released retention due';

  }
  const p = prompt.toLowerCase().trim();

  if (/^(hi|hello|hey|good (morning|afternoon|evening))/.test(p) || /what can you do|help/.test(p)) {

      text: `Hello! I'm your **AI Accountant Assistant** for ${db.company.name}.\n\nI can help you with:\n• 📊 **Financial summary** — cash, receivables, payables, profit\n• 💸 **Collections** — who owes you and how long overdue\n• 📥 **Payables** — who you owe and when\n• ⛭ **Rental ops** — overdue equipment, utilization, deposits\n• 🧾 **VAT** — current position and filing\n• 📦 **Inventory** — low-stock alerts\n• 📈 **Analytics** — top customers, monthly revenue, expense breakdown\n• 🛠️ **Actions** — open a new invoice, rental, or POS\n\nJust ask in plain English. Try one of the quick chips below.`,
      actions: aiSuggestions()

  if (/summary|overview|how (am|are) (i|we)|health|doing|financial position|net worth/.test(p)) {

        `💰 **Cash & bank:** ${money(s.cash)}\n` +
        `📥 **Receivables (AR):** ${money(s.ar)}\n` +
        `📤 **Payables (AP):** ${money(s.ap)}\n` +
        `📦 **Inventory value:** ${money(s.inventoryValue)}\n\n` +
        `📈 **Revenue (all time):** ${money(s.revenue)}\n` +
        `📉 **Expenses (all time):** ${money(s.expenses)}\n` +
        `✅ **Net profit:** ${money(s.netProfit)}\n\n` +

    };
  }

  if (/\bcash\b|bank balance|money on hand/.test(p)) {
    const c1 = acctBalance('1000'), c2 = acctBalance('1010'), c3 = acctBalance('1020');
    return {
      text: `**💰 Cash Position**\n\n` +
        `• Cash on hand: **${money(c1)}**\n• Republic Bank: **${money(c2)}**\n• Petty cash: **${money(c3)}**\n\n` +
        `**Total liquid cash: ${money(c1 + c2 + c3)}**`,
      actions: [{ label: '📊 View Trial Balance', onclick: "go('trial')" }]
    };

  if (/(overdue|late|outstanding|unpaid).*(invoice|receivable|ar|customer)/.test(p) || /(invoice|receivable|ar|customer).*(overdue|late|outstanding|unpaid)/.test(p) || /who owes/.test(p) || /collections/.test(p)) {
    const list = aiExec.list_overdue_invoices();

    const total = r2(list.reduce((s,i)=>s+i.balance,0));

      text: `**💸 Overdue Receivables — ${list.length} invoice${list.length>1?'s':''} · ${money(total)} past due**\n\n${rows}${list.length > 8 ? `\n…and ${list.length-8} more` : ''}\n\nPrioritise the largest and oldest first — cash flow is your biggest lever right now.`,

    const list = aiExec.list_overdue_bills();
    if (!list.length) return { text: `✅ **No overdue vendor bills.** Total AP: ${money((db.bills||[]).reduce((s,b)=>s+billDue(b),0))}.` };
    const total = r2(list.reduce((s,i)=>s+i.balance,0));
    const rows = list.slice(0, 8).map(i => `• **${i.vendor}** (${i.id}) — ${money(i.balance)} — **${i.daysLate}d late**`).join('\n');
    return {
      text: `**📤 Overdue Payables — ${list.length} bill${list.length>1?'s':''} · ${money(total)} past due**\n\n${rows}\n\nPay the largest/oldest first to protect vendor relationships — especially suppliers you depend on.`,
      actions: [{ label: '📄 View all bills', onclick: "go('bills')" }, { label: '📊 AP Aging report', onclick: "ui.reportTab='aging-ap';go('reports')" }]
    };
  }

  if (/(overdue|late).*(rental|equipment|fleet)/.test(p) || /rental.*overdue/.test(p)) {

    if (!list.length) return { text: `✅ **No overdue rentals.** All equipment is within its agreement window.` };
    const rows = list.map(r => `• **${r.customer}** (${r.id}) — **${r.daysLate}d late** — ${r.equipment.join(', ')}`).join('\n');
    return {
      text: `**⛭ Overdue Rentals — ${list.length} agreement${list.length>1?'s':''}**\n\n${rows}\n\n⚠️ Late fees accrue at ${db.company.lateFeePct}% of the rental charge **per day**. Consider a courtesy call to arrange return.`,

    };
  }

  if (/\bvat\b|tax return|filing/.test(p)) {
    const v = aiExec.get_vat_position();
    return {
      text: `**🧾 VAT Position — ${v.month}**\n\n` +
        `• Output tax (sales): **${money(v.outputTax)}**\n` +
        `• Input tax (purchases): **${money(v.inputTax)}**\n\n` +
        `**${v.netPayable >= 0 ? 'VAT payable to IRD' : 'VAT refundable'}: ${money(Math.abs(v.netPayable))}**\n\n` +
        `VAT rate is ${v.vatRate}%. Filing is due by the 20th of the following month. VAT Reg: ${db.company.vatNo}.`,

    const rows = list.map(i => `• **${i.name}** (${i.sku}) — on hand: **${i.onHand}**, reorder at ${i.reorderAt} → short by ${i.shortfall}`).join('\n');
    return {
      text: `**📦 Low Stock Alerts — ${list.length} item${list.length>1?'s':''}**\n\n${rows}\n\nReplenish before the next site draw. You can raise a purchase bill in Accounts Payable.`,
      actions: [{ label: '📦 View inventory', onclick: "go('inventory')" }, { label: '+ New Bill', onclick: "go('bills');setTimeout(()=>newBillModal(),200)" }]
    };
  }

  if (/profit|p&l|income statement|earnings|net income/.test(p)) {
    const rev = accountsByType('Revenue').reduce((s,a)=>s+acctBalance(a.code),0);
    const exp = accountsByType('Expense').reduce((s,a)=>s+acctBalance(a.code),0);
    const net = r2(rev - exp);
    return {
      text: `**📈 Profit & Loss**\n\n• Total revenue: **${money(rev)}**\n• Total expenses: **${money(exp)}**\n\n` +
        `**${net >= 0 ? 'Net profit' : 'Net loss'}: ${money(Math.abs(net))}**\n\n` +
        `Margin: ${rev ? ((net/rev)*100).toFixed(1) : '0'}%.`,

    };

  if (/expense|spending|cost|where.*money.*going/.test(p)) {

    return {
      text: `**📉 Expense Breakdown — Top ${list.length}**\n\n${rows}\n\nTotal expenses: **${money(accountsByType('Expense').reduce((s,a)=>s+acctBalance(a.code),0))}**`,
      actions: [{ label: '📈 Income Statement', onclick: "go('statements')" }]

  if (/point of sale|\bpos\b|checkout/.test(p)) { setTimeout(() => go('pos'), 100); return { text: `✅ Taking you to the **Point of Sale**.` }; }
  if (/dashboard/.test(p)) { setTimeout(() => go('dashboard'), 100); return { text: `✅ Back to the **Dashboard**.` }; }
  if (/settings|api key/.test(p)) { setTimeout(() => go('settings'), 100); return { text: `✅ Opening **Settings** — you can configure your DeepSeek API key here.` }; }

  return {
    text: `I'm not sure I caught that. I can help with:\n\n• **Summaries** — "how am I doing?"\n• **Collections** — "who owes me money?"\n• **Payables** — "who do I owe?"\n• **Rentals** — "which rentals are overdue?"\n• **VAT** — "VAT position this month"\n• **Stock** — "what's low on stock?"\n• **Actions** — "open a new invoice"\n\nTry rephrasing, or tap a suggestion:`,
    actions: aiSuggestions()
  };
}
function aiSuggestions() {
  return [

You are a professional chartered accountant and ERP assistant. You have access to a live tool set that reads the company's real ERP database (invoices, bills, rentals, inventory, general ledger, VAT). 

Guidelines:
- Always call a tool when the user's question can be answered from data. Never fabricate numbers.
- Be concise, use bullet points, and format amounts as EC$X,XXX.XX.
- Where useful, give a short recommendation (e.g. "chase the two largest overdue invoices first").
- If asked to create an invoice/bill/rental, explain you can guide them but the actual action happens via the ERP's form — suggest the user tap the relevant action button.
- Reply in a warm, professional tone suited to a business owner in St. Lucia.`;

async function aiDeepSeek(prompt) {
  if (!AI.apiKey) throw new Error('No API key');
  requireValue(new URL(AI.apiBase).protocol === 'https:', 'Use a trusted HTTPS endpoint.');
  const messages = [
    { role: 'system', content: systemPrompt() },
    ...AI.chat.filter(m => m.role === 'user' || (m.role === 'assistant' && m.content)).map(m => ({ role: m.role, content: m.content })),
    { role: 'user', content: prompt }
  ];
  let iterations = 0;
  while (iterations++ < 5) {
    const res = await fetch(AI.apiBase.replace(/\/$/, '') + '/chat/completions', {
      method: 'POST',
      signal: AbortSignal.timeout(20000),
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AI.apiKey },
      body: JSON.stringify({ model: AI.model, messages, tools: aiTools(), tool_choice: 'auto', temperature: 0.3 })
    });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`API ${res.status}: ${txt.slice(0, 200)}`);
    }
    const data = await res.json();
    const msg = data.choices[0].message;
    if (!msg.tool_calls || !msg.tool_calls.length) return msg.content || '(no response)';
    messages.push(msg);
    for (const tc of msg.tool_calls) {
      let result;
      try { result = aiExec[tc.function.name](JSON.parse(tc.function.arguments || '{}')); }
      catch (e) { result = { error: String(e) }; }
      messages.push({ role: 'tool', tool_call_id: tc.id, content: JSON.stringify(result) });
    }
  }
  return 'I ran out of analysis steps — please rephrase or narrow the question.';
}

async function aiRespond(prompt) {
  if (AI.apiKey && AI.apiBase) {
    try { return { text: await aiDeepSeek(prompt), actions: [] }; }
    catch (e) { console.warn('DeepSeek failed, using local:', e); }
  }
  return aiLocal(prompt);
}

function projectFigures(projectId, asOf) {
  const posted = record => !asOf || record.date <= asOf;
  const invoices = db.invoices.filter(i => i.projectId === projectId && posted(i));
  const bills = db.bills.filter(b => b.projectId === projectId && posted(b));
  const costRefs = new Set([...invoices.map(i => i.id), ...bills.map(b => b.id)]);
  const payrollCost = r2(db.gl.filter(e=>e.source==='Caribbean Payroll' && posted(e))
    .flatMap(e=>e.lines).filter(l=>l.projectId===projectId && account(l.code)?.type==='Expense')
    .reduce((sum,l)=>sum+l.debit-l.credit,0));
  const costs = db.gl.filter(e => posted(e) && (costRefs.has(e.ref) && ['Sales', 'COGS', 'Purchase'].includes(e.source) ||
    e.ref === projectId && e.source === 'Job Materials'))
    .flatMap(e => e.lines).filter(l => account(l.code)?.type === 'Expense')
    .reduce((sum, l) => sum + l.debit - l.credit, 0);
  const billed = r2(invoices.reduce((sum, i) => sum + i.subtotal, 0));
  return { invoices, bills, payrollCost, costs: r2(costs + payrollCost), billed, margin: r2(billed - costs - payrollCost),
    due: r2(invoices.reduce((sum, i) => sum + invoiceDue(i), 0)) };
}

  requireValue(Number.isFinite(data.budget) && data.budget >= 0, 'Enter a nonnegative cost budget.');
  atomic(() => {
    db.projects ||= [];
    const project = db.projects.find(p => p.id === id);
    const terms = readProjectTerms(project,data);
    if (project?.contract) requireValue(project.customerId===data.customerId && project.start===data.start &&
      project.due===data.due && project.budget===data.budget && project.scope===data.scope &&
      (project.terms?.deliverables || '')===(terms?.deliverables || ''),
      'Use an approved variation to change the signed scope, finish date or cost budget. The customer and start date are locked.');
    if (project) {
      requireValue(!project.closed && !project.signoff,'Project details are locked after sign-off.');
      requireValue(!project.contract || data.status!=='Complete','Use completion sign-off in the Contract lifecycle panel.');
      requireValue(project.tasks.every(t => t.due >= data.start && t.due <= data.due),

      requireValue(data.status !== 'Complete' || project.tasks.every(t => t.status === 'Done'), 'Complete the remaining tasks first.');
      requireValue(project.customerId === data.customerId || !db.invoices.some(i => i.projectId === id), 'This project already has invoices for its customer.');
      Object.assign(project, data, {terms});
      if (!project.contract && terms?.draftContract?.date) approveProjectContract(project,{...terms.draftContract,note:''});
    } else {
      id = 'JOB-' + uid();
      const created={id,...data,terms,tasks:[]};
      if (terms?.draftContract?.date) approveProjectContract(created,{...terms.draftContract,note:''});
      db.projects.push(created);

  });

function saveTask(projectId, taskId) {
  const p = db.projects.find(item => item.id === projectId);
  requireValue(!p.signoff && !p.closed,'The work schedule is locked after completion sign-off.');
  const data = { name: val('taskName'), owner: val('taskOwner'), due: val('taskDue'), status: val('taskStatus') };
  const billingValue=Number(val('term_taskBilling'));
  const acceptanceRef=val('term_taskApproval');
  requireValue(Number.isFinite(billingValue) && billingValue>=0 && billingValue<=1e9 && r2(billingValue)===billingValue,
    'Enter a valid milestone billing value.');
  requireValue(!billingValue || data.status!=='Done' || acceptanceRef,'Enter a client acceptance reference before completing a billable milestone.');
  requireValue(!db.invoices.some(i=>i.projectId===projectId && i.milestoneId===taskId),'This billed milestone is locked.');
  Object.assign(data,{billingValue,acceptanceRef});
  requireValue(data.name && validDate(data.due) && data.due >= p.start && data.due <= p.due,
    'Enter a task name and due date within the project schedule.');
  requireValue(p.status !== 'Complete' || data.status === 'Done', 'Reopen the project before scheduling unfinished work.');
  atomic(() => {
    const task = p.tasks.find(t => t.id === taskId);
    if (task) Object.assign(task, data);
    else p.tasks.push({ id: uid(), ...data });
  });
  render();
  showProject(projectId);
}

function saveMaterialsIssue(id) {

}
