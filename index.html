function parseDelimited(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const delimiter = ['\t', ';', ','].map(char => [char, first.split(char).length]).sort((a,b) => b[1]-a[1])[0][0];
  const rows = [];
  let row = [], field = '', state = 'start';
  function addField() {
    row.push(field);
    requireValue(row.length <= 100, 'A sheet can contain up to 100 columns.');
    field = ''; state = 'start';
  }
  function addRow() {
    addField(); rows.push(row); row = [];
    requireValue(rows.length <= 10001, 'A sheet can contain up to 10,000 data rows.');
  }
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (state === 'quote') {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') state = 'closed';
      else field += c;
    } else if (c === delimiter) addField();
    else if (c === '\r' || c === '\n') {
      if (c === '\r' && text[i+1] === '\n') i++;
      addRow();
    } else if (c === '"' && state === 'start') state = 'quote';
    else {
      requireValue(state !== 'closed' && c !== '"', 'Invalid quoting in the delimited file.');
      field += c; state = 'text';
    }
  }
  requireValue(state !== 'quote', 'A quoted field is missing its closing quote.');
  if (row.length || field || state !== 'start') addRow();
  return rows;
}

/* XLSX ZIP reader with limits on both declared and actual inflated sizes. */
function excelArchive(buffer) {
  const bytes = new Uint8Array(buffer);
  const zip = new DataView(buffer);
  const u16 = offset => zip.getUint16(offset,true);
  const u32 = offset => zip.getUint32(offset,true);
  const decode = new TextDecoder();
  const maxBytes = 16 * 1024 * 1024;
  let end = bytes.length - 22;
  while (end >= Math.max(0, bytes.length - 65557) &&
    (u32(end) !== 0x06054b50 || end + 22 + u16(end+20) !== bytes.length)) end--;
  requireValue(end >= Math.max(0, bytes.length - 65557) && !u16(end+4) && !u16(end+6), 'This is not a supported .xlsx workbook.');
  const count = u16(end+10);
  let cursor = u32(end+16);
  requireValue(count <= 2048 && cursor <= end, 'The workbook archive is too large or invalid.');
  const entries = new Map();
  for (let i=0;i<count;i++) {
    requireValue(cursor+46 <= end && u32(cursor) === 0x02014b50, 'Invalid workbook archive.');
    const next = cursor+46+u16(cursor+28)+u16(cursor+30)+u16(cursor+32);
    requireValue(next <= end, 'Invalid workbook directory.');
    const name = decode.decode(bytes.subarray(cursor+46,cursor+46+u16(cursor+28)));
    if (!entries.has(name)) entries.set(name,cursor);
    cursor = next;
  }
  return async name => {
    const entry = entries.get(name);
    if (entry === undefined) return null;
    const method = u16(entry+10), compressed = u32(entry+20), size = u32(entry+24), local = u32(entry+42);
    requireValue(!(u16(entry+8) & 1) && size <= maxBytes && local+30 <= end && u32(local) === 0x04034b50,
      'The workbook contains an encrypted, oversized or invalid file.');
    const start = local+30+u16(local+26)+u16(local+28);
    requireValue(start+compressed <= end && [0,8].includes(method) && (method !== 0 || compressed === size), 'Unsupported workbook compression.');
    const data = bytes.subarray(start,start+compressed);
    let plain = data;
    if (method === 8) {
      requireValue(typeof DecompressionStream === 'function', 'Use a current browser for Excel files, or save the sheet as CSV.');
      const reader = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
      plain = new Uint8Array(size);
      let length = 0;
      try {
        while (true) {
          const {value,done} = await reader.read();
          if (done) break;
          requireValue(length+value.length <= size, 'Workbook exceeds its declared size.');
          plain.set(value,length); length += value.length;
        }
        requireValue(length === size, 'Workbook data is incomplete.');
      } finally { await reader.cancel(); }
    }
    const xml = decode.decode(plain);
    requireValue(!/<!DOCTYPE|<!ENTITY/i.test(xml), 'Unsupported workbook XML.');
    const doc = new DOMParser().parseFromString(xml,'application/xml');
    requireValue(!xnodes(doc,'parsererror').length, 'Invalid workbook XML.');
    return doc;
  };
}
async function openExcel(buffer) {
  const xml = excelArchive(buffer);
  const book = await xml('xl/workbook.xml');
  const rels = await xml('xl/_rels/workbook.xml.rels');
  requireValue(book && rels, 'The file does not contain a readable Excel workbook.');
  const targets = new Map(xnodes(rels,'Relationship').filter(r => r.getAttribute('TargetMode') !== 'External' &&
    (r.getAttribute('Type') || '').endsWith('/worksheet')).map(r => [r.getAttribute('Id'),r.getAttribute('Target')]));
  const shared = await xml('xl/sharedStrings.xml');
  const richText = node => xnodes(node,'t').map(n => n.textContent).join('');
  const strings = shared ? xnodes(shared,'si').map(richText) : [];
  const sheets = xnodes(book,'sheet').map(sheet => {
    const attr = Array.from(sheet.attributes).find(a=>a.localName === 'id');
    const target = targets.get(attr?.value);
    if (!target) return null;
    const path = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    if (!/^xl\/worksheets\/[\w.-]+\.xml$/.test(path)) return null;
    return { name:sheet.getAttribute('name'), read:async () => {
      const doc = await xml(path);
      requireValue(doc, 'This worksheet could not be found.');
      const rows = xnodes(doc,'row');
      requireValue(rows.length <= 10001,'A sheet can contain up to 10,000 data rows.');
      return rows.map(row => {
        const values=[];
        for (const cell of xnodes(row,'c')) {
          const letters = /^([A-Z]+)[0-9]+$/.exec(cell.getAttribute('r') || '')?.[1];
          const col = letters ? Array.from(letters).reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0)-1 : values.length;
          const type = cell.getAttribute('t');
          const raw = xnodes(cell,'v')[0]?.textContent ?? '';
          const value = type === 's' ? strings[Number(raw)] ?? '' : type === 'inlineStr' ? richText(cell) :
            type === 'b' ? raw === '1' ? 'true' : 'false' : raw;
          requireValue(type !== 'e' && (raw || !xnodes(cell,'f').length), 'Resolve worksheet errors or recalculate and save formula cells before importing.');
          if (col >= 100 && !value) continue;
          requireValue(col < 100,'A sheet can contain up to 100 columns.');
          values[col] = value;
        }
        return values;
      });
    }};
  }).filter(Boolean);
  requireValue(sheets.length, 'The workbook has no importable worksheets.');
  return sheets;
}

function importRows(matrix,kind) {
  const start = matrix.findIndex(row=>row.some(v=>String(v??'').trim()));
  requireValue(start >= 0,'The worksheet is empty.');
  const supported = new Set(IMPORT_TYPES[kind][1].split(','));
  const headers = matrix[start].map(value=>{
    const key = String(value??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
    const dest = IMPORT_ALIASES[kind][key] || key;
    return supported.has(dest) ? dest : '';
  });
  const recognized = headers.filter(Boolean);
  requireValue(new Set(recognized).size === recognized.length,'Two columns map to the same field.');
  const missing = IMPORT_REQUIRED[kind].filter(name=>!recognized.includes(name));
  requireValue(!missing.length,'Missing columns: '+missing.join(', ')+'. Download the template for this import.');
  const data = matrix.slice(start+1).flatMap((row,index)=>{
    if (!row.some(v=>String(v??'').trim())) return [];
    return [{ number:start+index+2, values:Object.fromEntries(recognized.map(key=>[key,String(row[headers.indexOf(key)]??'').trim()])) }];
  });
  requireValue(data.length,'There are no data rows under the headers.');
  return {data,columns:recognized};
}
function importMoney(value,label,required=false) {
  if (!value && !required) return 0;

  requireValue(/^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?$/.test(text) &&
    Number(text.replaceAll(',','')) <= 1000000000, 'Enter a nonnegative '+label+' with up to two decimal places.');
  return Number(text.replaceAll(',',''));
}
function importIdentifier(value,label) {
  requireValue(/^[\w.-]{1,100}$/.test(value),label+' may contain letters, numbers, dots, hyphens and underscores.');
  return value;
}
function importAccount(value, type) {
  const a = account(value);
  requireValue(a && (!type || a.type === type), 'Choose an existing '+(type ? type.toLowerCase()+' ' : '')+'account for '+value+'.');
  return a.code;
}
function getOpeningAssetTotals(items=db.items) {

function buildImport(kind, sheet, options) {

  }

        requireValue(type!=='Service' || qty===0,'Services must have zero stock.');
        const tax=(v.taxable||'yes').toLowerCase();

        const item={hslEligible:['yes','true','1'].includes(levy),sku:v.sku,name:v.name,type,qty,cost,onRent:0,category:v.category||'',unit:v.unit||'unit',
          price:importMoney(v.price,'price'),reorder:importMoney(v.reorder,'reorder quantity'),
          taxable:['yes','true','1'].includes(tax), dayRate:importMoney(v.daily_rate,'daily rate'),
          weekRate:importMoney(v.weekly_rate,'weekly rate'),monthRate:importMoney(v.monthly_rate,'monthly rate'),
          deposit:importMoney(v.deposit,'deposit'),
          revAcct:importAccount(v.revenue_account||(type==='Rental'?'4020':type==='Service'?'4000':'4010'),'Revenue'),
          cogsAcct:importAccount(v.cogs_account||(type==='Rental'?'6200':'5000'),'Expense')};
        requireValue(type!=='Rental' || item.dayRate>0,'Rental tools need a positive daily rate.');
        if (type==='Inventory') item.stockValue=r2(qty*cost);
        rows.push(item);
      } else if (kindParty) {
        requireValue(v.name,'Name is required.');
        const id=v.id ? importIdentifier(v.id,'Party ID') : '';
        if (id) unique(id,db[kind].map(p=>p.id));
        else unique(v.name,db[kind].map(p=>p.name));
        rows.push({id,name:v.name,contact:v.contact||'',phone:v.phone||'',email:v.email||'',addr:v.address||'',terms:v.terms||db.company.terms||''});
      } else if (kind==='accounts') {

        requireValue(type && v.name,'Enter an account name and a valid account type.');

        requireValue(!db.gl.some(e=>e.source==='Import Stock' && e.date!==options.date),'Use the same opening date as previous stock uploads.');
    }
    if (Object.values(assets).some(Boolean)) {
      const clearing=account('3090');
      requireValue(!clearing || clearing.type==='Equity' && clearing.name==='Opening Stock Clearing','Account 3090 is reserved for Opening Stock Clearing.');
      lines.push(...Object.entries(assets).filter(([,debit])=>debit).map(([code,debit])=>({code,debit})),
        {code:'3090',credit:r2(assets['1200']+assets['1500'])});
    }
  }
  if (isOpening) {
    requireValue(r2(rows.reduce((sum,l)=>sum+l.debit-l.credit,0))===0,'The opening trial balance must balance to the cent.');
    const totals=new Map(rows.map(l=>[l.code,r2(l.debit-l.credit)]));
    for (const [code,value] of Object.entries(getOpeningAssetTotals()))
      requireValue((totals.get(code)||0)===value,'Account '+code+' must equal imported opening stock/equipment of '+money(value)+'. Import the quantities and costs first.');
    for (const a of db.accounts) {
      const existing=db.gl.flatMap(e=>e.lines).filter(l=>l.code===a.code).reduce((s,l)=>s+l.debit-l.credit,0);
      const delta=r2((totals.get(a.code)||0)-existing);
      if (delta) lines.push({code:a.code,debit:Math.max(0,delta),credit:Math.max(0,-delta)});
    }
    requireValue(lines.length,'Enter an opening trial balance with balances to post.');
    if (totals.get('1100') || totals.get('2000')) warnings.push('Trade receivables and payables will post as ledger balances only. Customer invoices, vendor bills and aging details are outside this opening import.');
  }
  if (isPayroll) {
    if (!columns.includes('employer_nic')) {
      const amount=importMoney(options.employer,'employer NIC/NIS total',true);
      const projects=new Set(rows.map(r=>r.projectId));
      requireValue(!amount || projects.size===1,'For multiple projects, add employer_nic per row so the contribution can be allocated correctly.');
      rows[0].employer=amount;
    }
    const {wages,overhead,burden,net,paye,nic,other}=options.accounts;
    importAccount(wages,'Expense'); importAccount(burden,'Expense');
    [net,paye,nic,other].forEach(code=>importAccount(code,'Liability'));
    const journal=new Map();
    function add(code,amount,projectId='') {
      if (!amount) return;
      const key=JSON.stringify([code,projectId,amount>0]);
      const old=journal.get(key) || {code,projectId,debit:0,credit:0};
      old.debit=r2(old.debit+Math.max(0,amount));
      old.credit=r2(old.credit+Math.max(0,-amount));
      journal.set(key,old);
    }
    for (const r of rows) {
      add(r.projectId ? wages : overhead,r.gross,r.projectId);
      add(burden,r.employer,r.projectId);
      add(net,-r.net); add(paye,-r.paye); add(nic,-r2(r.nic+r.employer));
      add(other,-r2(r.deductions-r.paye-r.nic));
    }
    importAccount(overhead,'Expense');
    lines.push(...journal.values());
    requireValue(lines.length,'The payroll file has no amounts to post.');
  }
  return {rows,lines,errors,warnings};
}

function commitIntake() {

  requireValue(preview.snapshot===savedSnapshot,'Company records changed. Validate the file again before posting.');
  requireValue(JSON.stringify(intakeOptions())===JSON.stringify(preview.options),'Import settings changed. Validate the file again.');
  const plan=buildImport(kind,preview.matrix,preview.options);
  requireValue(!plan.errors.length,'Data changed. Validate the file again.');
  const ref=kind==='payroll' ? preview.options.run : 'IMP-'+uid();
  atomic(()=>{
    if (kind==='items') {
      db.items.push(...plan.rows.map(row=>({id:'ITM-'+uid(),...row})));
      if (plan.lines.length && !account('3090')) db.accounts.push({code:'3090',name:'Opening Stock Clearing',type:'Equity'});
    } else if (kind==='customers' || kind==='vendors') {
      db[kind].push(...plan.rows.map(row=>({...row,id:row.id || (kind==='customers'?'CUST-':'VEND-')+uid()})));
    } else if (kind==='accounts') db.accounts.push(...plan.rows);
    const source={items:'Import Stock',opening:'Opening Import',payroll:'Caribbean Payroll'}[kind];

      const entry=post(preview.options.date,IMPORT_TYPES[kind][0]+' · '+ref,ref,source,plan.lines);

  changeIntakeType(kind);
  toast(plan.rows.length+' rows imported · '+ref,'ok');

/* Construction contract administration and retention accounting. */
const RETENTION_ACCOUNT = '1110';
function job(id) { return (db.projects || []).find(p => p.id === id); }
function contractInvoices(id) { return db.invoices.filter(i => i.projectId === id && i.source !== 'Retention Release'); }
function jobCommercial(p) {
  const invoices = contractInvoices(p.id);
  const releases = db.invoices.filter(i => i.projectId === p.id && i.source === 'Retention Release');
  const value = r2((p.contract?.value || 0) + (p.variations || []).reduce((sum,v)=>sum+v.amount,0));
  const billed = r2(invoices.reduce((sum,i)=>sum+i.subtotal,0));
  const held = r2(invoices.reduce((sum,i)=>sum+(i.retentionHeld || 0),0) - releases.reduce((sum,i)=>sum+i.total,0));
  const ordinaryDue = r2(invoices.reduce((sum,i)=>sum+invoiceDue(i),0));
  const releaseDue = r2(releases.reduce((sum,i)=>sum+invoiceDue(i),0));
  const cash = r2([...invoices,...releases].reduce((sum,i)=>sum+i.paid,0));
  const phase = p.closed ? 'Closed' : p.finalAccount ? (ordinaryDue ? 'Awaiting final payment' :
    held ? 'Retention held' : releaseDue ? 'Awaiting retention payment' : 'Ready to close') :
    p.signoff ? 'Signed off' : p.status === 'On Hold' ? 'On Hold' :
    p.contract ? (invoices.length || p.status === 'Active' ? 'In progress' : 'Contract signed') : p.status;
  return { invoices,releases,value,billed,held,ordinaryDue,releaseDue,cash,phase,remaining:r2(value-billed) };
}

function jobRetention(p, amount) {
  const retained=contractInvoices(p.id).reduce((s,i)=>s+(i.retentionHeld||0),0);
  const calculated=r2(amount*p.contract.rate/100);
  return p.contract.cap ? Math.max(0,r2(Math.min(calculated,p.contract.cap-retained))) : calculated;
}
function updateJobPreview(id, action) {

  const retained=jobRetention(job(id),Math.max(0,amount));
  document.getElementById('lcPreview').innerHTML=invoiceTaxRows(tax,'style="display:flex;justify-content:space-between"')+
    `<p>Retention withheld <strong>${money(retained)}</strong> · Collectible now <strong>${money(r2(tax.total-retained))}</strong></p>`;

function chronologicalJobDate(p) {

    ...db.invoices.filter(i=>i.projectId===p.id).map(i=>i.date)].filter(Boolean).sort().at(-1) || '';

function postRetentionRelease(p, {date,dueDate,ref,amount,note}) {

    subtotal:0,hsl:0,vat:0,vatBase:0,total:amount,paid:0,status:'Open'};

function saveJobAction(id, action) {
  const p=job(id);
  requireValue(p && !p.closed,'This project is closed.');
  const date=val('lcDate'),ref=val('lcRef'),note=val('lcNote'),due=val('lcDue');
  const amount=val('lcAmount') ? Number(val('lcAmount')) : NaN;
  const f=jobCommercial(p);
  requireValue(ref && validDate(date) && date<=today(),'Enter a reference and an effective date through today.');
  requireValue(action==='contract' || p.contract && date>=chronologicalJobDate(p),'Record the contract first and use dates in chronological order.');
  const validAmount=Number.isFinite(amount) && r2(amount)===amount && Math.abs(amount)<=1000000000;
  atomic(()=>{
    if (action==='contract') {
      const rate=Number(val('lcRate')),cap=Number(val('lcCap'));
      requireValue(validAmount && val('lcRate')!=='','Enter a contract value and retention percentage.');
      approveProjectContract(p,{ref,date,note,value:amount,rate,cap});
    } else if (action==='variation') {
      const budgetChange=Number(val('term_budgetChange'));
      const revisedDue=val('lcRevisedDue') || p.due;
      requireValue(!p.signoff && validAmount && Number.isFinite(budgetChange) && r2(budgetChange)===budgetChange &&
        (amount || budgetChange || revisedDue!==p.due || note) && r2(f.value+amount)>=f.billed && r2(f.value+amount)>0 && note,
        'Enter an approved change with a description before sign-off. Revised value must cover billed work.');
      requireValue(validDate(revisedDue) && revisedDue>=p.start && p.tasks.every(t=>t.due<=revisedDue) &&
        r2(p.budget+budgetChange)>=(p.terms?.contingency || 0),'The revised date must include scheduled work and the revised budget must cover contingency.');
      requireValue(!(p.variations||[]).some(v=>v.ref.toLowerCase()===ref.toLowerCase()),'This variation is already recorded.');
      (p.variations ||= []).push({ref,date,note,amount,budgetChange,previousDue:p.due,revisedDue});
      p.budget=r2(p.budget+budgetChange);
      p.due=revisedDue;
    } else if (action==='progress' || action==='final') {
      const final=action==='final';
      requireValue(!p.finalAccount && (final ? p.signoff : !p.signoff && p.status!=='On Hold'),'This certificate is out of sequence.');
      requireValue(validAmount && (final ? amount===f.remaining : amount>0 && amount<=f.remaining),'Enter an amount within the unbilled contract value. The final account must equal the remaining value.');
      requireValue(validDate(due) && due>=date,'Enter an invoice due date on or after the certificate date.');
      requireValue(!f.invoices.some(i=>i.certificateRef?.toLowerCase()===ref.toLowerCase()),'This certificate is already posted.');
      let milestoneId;
      if (!final && p.terms?.billing==='Accepted milestones') {
        const milestone=p.tasks.find(t=>t.id===val('lcMilestone'));
        requireValue(milestone?.status==='Done' && milestone.acceptanceRef && milestone.billingValue===amount &&
          !f.invoices.some(i=>i.milestoneId===milestone.id),'Choose an unbilled accepted milestone and use its approved amount.');
        milestoneId=milestone.id;
      }
      const inv=amount ? createInvoice({customerId:p.customerId,projectId:p.id,date,dueDate:due,
        source:final?'Construction Final':'Construction Progress',certificateRef:ref,milestoneId,retentionHeld:jobRetention(p,amount),
        notes:note,lines:[{desc:(final?'Final account ':'Progress certificate ')+ref,qty:1,rate:amount,
          revAcct:'4000',taxable:document.getElementById('lcVat').checked,hslEligible:document.getElementById('lcHsl').checked}]}) : null;
      if (final) p.finalAccount={ref,date,note,invoiceId:inv?.id || ''};
      else p.status='Active';
    } else if (action==='signoff') {
      const person=val('lcPerson');
      requireValue(!p.signoff && person && validDate(due) && due>=jobDatePlus(date,p.terms?.defectsDays??0) && date>=p.start && p.tasks.every(t=>t.status==='Done'),
        'Finish scheduled tasks, enter the signatory and allow for the agreed minimum retention period.');
      p.signoff={ref,date,releaseDate:due,person,note};
    } else if (action==='release') {
      requireValue(p.finalAccount && !f.ordinaryDue && date>=p.signoff.releaseDate && validAmount && amount>0 && amount<=f.held,
        'Settle the project invoices, reach the retention release date and enter an amount within the retention held.');
      requireValue(validDate(due) && due>=date,'Enter a retention due date on or after the release date.');
      requireValue(!f.releases.some(i=>i.certificateRef.toLowerCase()===ref.toLowerCase()),'This retention release is already posted.');
      const refs=new Set(f.invoices.map(i=>i.id));
      requireValue(!db.payments.some(payment=>refs.has(payment.ref) && payment.date>date),
        'The retention release date must be on or after settlement of the project invoices.');
      postRetentionRelease(p,{date,dueDate:due,ref,amount,note});
    } else if (action==='close') {
      const bills=db.bills.filter(b=>b.projectId===id);
      requireValue(f.phase==='Ready to close' && bills.every(b=>billDue(b)===0),'Collect all invoices and retention, and settle all linked vendor bills before closing.');
      const refs=new Set([...f.invoices,...f.releases,...bills].map(i=>i.id));
      requireValue(!db.payments.some(payment=>refs.has(payment.ref) && payment.date>date),
        'The closure date must be on or after the last payment.');
      p.closed={ref,date,note};
      p.status='Complete';
    } else throw new Error('Unknown construction action.');
  });
  render();
  showProject(id);
  toast(JOB_ACTIONS[action]+' recorded','ok');
}

/* Project controls use budget-weighted physical progress and posted job costs. */
function evmPlan(p) {
  return p.evm?.plans?.at(-1);
}
function evmPackageValues(w,progress,date) {
  const elapsed=(Date.parse(date)-Date.parse(w.start))/86400000;
  const duration=(Date.parse(w.finish)-Date.parse(w.start))/86400000+1;
  return {pv:w.budget*Math.max(0,Math.min(1,(elapsed+1)/duration)),
    ev:w.budget*(progress?.date<=date ? progress.percent/100 : 0)};
}
function evmMetrics(p, actual, date=today()) {
  const plan=evmPlan(p);
  const ac=r2(actual);
  if (!plan) return {ac};
  let pv=0, ev=0;
  for (const w of plan.packages) {
    const values=evmPackageValues(w,p.evm.progress[w.id],date);
    pv+=values.pv; ev+=values.ev;
  }
  pv=r2(pv); ev=r2(ev);
  const cpi=ac>0 ? ev/ac : null, spi=pv>0 ? ev/pv : null;
  const complete=ev>=plan.bac;
  const eac=complete ? ac : cpi>0 ? r2(plan.bac/cpi) : null;
  return {ac,bac:plan.bac,pv,ev,cpi,spi,eac,cv:r2(ev-ac),sv:r2(ev-pv),
    etc:eac===null ? null : r2(eac-ac),vac:eac===null ? null : r2(plan.bac-eac)};
}

function saveEvmPlan(id) {

function performanceData(month) {
  const eligible=db.gl.filter(e=>e.date<=today() && e.date.startsWith(month+'-'));
  let revenue=0, expense=0;
  for (const e of eligible) for (const l of e.lines) {
    const type=account(l.code)?.type;
    if (type==='Revenue') revenue+=l.credit-l.debit;
    if (type==='Expense') expense+=l.debit-l.credit;
  }
  const receipts=db.payments.filter(p=>p.type==='received' && p.date<=today() && p.date.startsWith(month+'-')).reduce((sum,p)=>sum+p.amount,0);
  const futureReceipts=new Map();
  for (const payment of db.payments)
    if (payment.type==='received' && payment.date>today())
      futureReceipts.set(payment.ref,(futureReceipts.get(payment.ref)||0)+payment.amount);
  const overdue=db.invoices.filter(i=>i.date<=today() && i.dueDate<today())
    .reduce((sum,i)=>sum+invoiceDue(i)+(futureReceipts.get(i.id)||0),0);
  const inventory=db.items.filter(i=>i.type==='Inventory');
  const fleet=db.items.filter(i=>i.type==='Rental');
  const fleetSize=fleet.reduce((sum,i)=>sum+i.qty,0);
  const out=fleet.reduce((sum,i)=>sum+(i.onRent||0),0);
  return {revenue:r2(revenue),expense:r2(expense),profit:r2(revenue-expense),receipts:r2(receipts),overdue:r2(overdue),
    cash:r2(['1000','1010','1020'].reduce((sum,code)=>sum+acctBalance(code,today()),0)),
    ar:acctBalance('1100',today()),ap:acctBalance('2000',today()),retention:acctBalance('1110',today()),
    lowStock:inventory.filter(i=>i.qty<=i.reorder).length, overdueRentals:db.rentals.filter(rentalOverdue).length,
    utilization:fleetSize ? out/fleetSize : null};
}

/* Read-only details for Performance Dashboard indicators. */
const PERFORMANCE_TABS = {
  business:'Business performance', operations:'Cash & operations', portfolio:'Construction portfolio', evm:'Earned value'
};
const PERFORMANCE_METRICS = {
  revenue:'Revenue', expense:'Expenses', profit:'Ledger profit / (loss)', receipts:'Customer receipts',
  cash:'Cash and bank', ar:'Trade receivables', overdue:'Overdue invoices', ap:'Trade payables',
  retention:'Unreleased retention (ledger)', utilization:'Rental fleet out', overdueRentals:'Overdue rentals',
  lowStock:'Items at or below reorder point'
};
const EVM_METRICS = {
  bac:['Budget at completion (BAC)','Total approved work-package budgets, excluding contingency.'],
  pv:['Planned value (PV)','Sum of each package’s budget multiplied by its planned completion. Planned completion is spread evenly across scheduled calendar days.'],
  ev:['Earned value (EV)','Sum of work-package budgets multiplied by measured physical completion.'],
  ac:['Actual cost (AC)','Posted job expense lines from linked bills and sales, issued materials and allocated payroll.'],
  cv:['Cost variance (CV)','Earned value minus actual cost.'],
  sv:['Schedule variance (SV)','Earned value minus planned value, expressed in dollars.'],
  cpi:['Cost performance (CPI)','Earned value divided by actual cost.'],
  spi:['Schedule performance (SPI)','Earned value divided by planned value.'],
  eac:['Forecast at completion (EAC)','Budget at completion divided by CPI while work remains. At full physical completion, EAC equals actual cost.'],
  etc:['Forecast remaining cost (ETC)','Estimate at completion minus actual cost.'],
  vac:['Forecast variance (VAC)','Budget at completion minus estimate at completion.']
};
function performanceTab(name) {

function drillTable(headers,rows) {
  return `<div style="overflow:auto"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') :
    `<tr><td colspan="${headers.length}" class="empty">No records for this selection.</td></tr>`}</tbody></table></div>`;
}
function drillButton(label,kind,id) {
  return `<button class="btn-sm" onclick="performanceSource('${kind}','${esc(id)}')">${esc(label)}</button>`;
}
function drillJournal(entries,include=()=>true) {
  return drillTable(['Date','Reference','Memo','Account','Debit','Credit'],entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).flatMap(e=>
    e.lines.filter(l=>include(l,e)).map(l=>[esc(e.date),drillButton(e.ref || 'Journal entry','journal',e.id),esc(e.memo),
      esc(l.code+' · '+(account(l.code)?.name||'')),money(l.debit),money(l.credit)])));
}
function drillInvoices(records,due=invoiceDue) {
  return drillTable(['Invoice','Customer','Issued','Due date','Total','Retention withheld','Outstanding'],records.map(i=>[
    drillButton(i.id,'invoice',i.id),esc(customerName(i.customerId)),esc(i.date),esc(i.dueDate),
    money(i.total),money(i.retentionHeld||0),money(due(i))]));
}
function drillReceipts(payments) {
  return drillTable(['Date','Receipt','Customer','Invoice','Method','Account','Amount'],payments.map(p=>[
    esc(p.date),esc(p.id),esc(customerName(p.partyId)),db.invoices.some(i=>i.id===p.ref)?drillButton(p.ref,'invoice',p.ref):esc(p.ref),
    esc(p.method),esc(account(p.account)?.name||p.account),money(p.amount)]));
}
function drillDueAsOf(doc,type,date=today()) {
  const later=db.payments.filter(p=>p.ref===doc.id && p.type===type && p.date>date).reduce((sum,p)=>sum+p.amount,0);
  return r2((type==='received'?invoiceDue(doc):billDue(doc))+later);
}
function drillBalanceNote(balance,details) {
  const gap=r2(balance-details);
  return `<p>Ledger balance <strong>${money(balance)}</strong> · Open documents ${money(details)}${gap?
    ' · Difference '+money(gap)+' (including any opening balances or separate journal postings)':''}</p>`;
}
function performanceMetric(key) {
  const label=PERFORMANCE_METRICS[key];
  if (!label) return;
  const date=today(), month=ui.performanceMonth || date.slice(0,7), d=performanceData(month);
  const posted=db.gl.filter(e=>e.date<=date);
  const period=e=>e.date<=date && e.date.startsWith(month+'-');
  let intro='', content='';
  if (['revenue','expense','profit'].includes(key)) {
    const types=key==='profit'?['Revenue','Expense']:[key==='revenue'?'Revenue':'Expense'];
    intro=`<p>Reporting month ${esc(month)} · ${money(d[key])}</p>`;
    content=drillJournal(posted.filter(period),l=>types.includes(account(l.code)?.type));
  } else if (key==='receipts') {
    intro=`<p>Reporting month ${esc(month)} · ${money(d.receipts)}</p>`;
    content=drillReceipts(db.payments.filter(p=>p.type==='received' && period(p)));
  } else if (key==='cash') {
    const codes=['1000','1010','1020'];
    intro=drillTable(['Cash or bank account','Balance'],codes.map(code=>[esc(account(code)?.name||code),money(acctBalance(code,date))]));
    content=drillJournal(posted,l=>codes.includes(l.code));
  } else if (key==='ar' || key==='overdue') {
    const due=i=>drillDueAsOf(i,'received',date);
    const invoices=db.invoices.filter(i=>i.date<=date && due(i)>0 && (key==='ar' || i.dueDate<date));
    const total=invoices.reduce((sum,i)=>sum+due(i),0);
    intro=key==='ar'?drillBalanceNote(d.ar,total):`<p>Overdue as of ${date} · ${money(total)}</p>`;
    content=drillInvoices(invoices,due)+(key==='ar'?`<details><summary>Receivables ledger postings</summary>${drillJournal(posted,l=>l.code==='1100')}</details>`:'');
  } else if (key==='ap') {
    const due=b=>drillDueAsOf(b,'made',date);
    const bills=db.bills.filter(b=>b.date<=date && due(b)>0);
    intro=drillBalanceNote(d.ap,bills.reduce((sum,b)=>sum+due(b),0));
    content=drillTable(['Bill','Vendor','Issued','Due date','Total','Outstanding'],bills.map(b=>[
      drillButton(b.id,'bill',b.id),esc(vendorName(b.vendorId)),esc(b.date),esc(b.dueDate),money(b.total),money(due(b))]))+
      `<details><summary>Payables ledger postings</summary>${drillJournal(posted,l=>l.code==='2000')}</details>`;
  } else if (key==='retention') {
    intro=`<p>Retention receivable as of ${date} · ${money(d.retention)}</p>`;
    content=drillJournal(posted,l=>l.code===RETENTION_ACCOUNT);
  } else if (key==='utilization') {
    content=drillTable(['Equipment','Fleet units','Out on rent','Available'],db.items.filter(i=>i.type==='Rental').map(i=>[
      drillButton(i.name,'fleetItem',i.id),i.qty,i.onRent||0,i.qty-(i.onRent||0)]));
  } else if (key==='overdueRentals') {
    content=performanceRentals(db.rentals.filter(rentalOverdue));
  } else {
    content=drillTable(['SKU','Item','On hand','Reorder point','Stock value'],db.items.filter(i=>i.type==='Inventory' && i.qty<=i.reorder).map(i=>[
      esc(i.sku),drillButton(i.name,'item',i.id),i.qty,i.reorder,money(stockValue(i))]));
  }
  performanceDetail(label,`<p class="muted">${esc(KPI_GUIDANCE[key])}</p>`+intro+content,()=>performanceMetric(key));
}
function performanceRentals(records) {
  return drillTable(['Agreement','Customer','Checked out','Due','Equipment'],records.map(r=>[
    drillButton(r.id,'rental',r.id),esc(customerName(r.customerId)),esc(r.dateOut),esc(r.dueDate),
    esc(r.lines.map(l=>itemName(l.itemId)+' × '+l.qty).join(', '))]));

function drillProjectCosts(id) {

    (['Sales','COGS','Purchase'].includes(e.source) && refs.has(e.ref) ||
    e.source==='Job Materials' && e.ref===id || e.source==='Caribbean Payroll' && l.projectId===id));

function projectPerformanceMetric(key,id) {
  const p=job(id);
  if (!p) return;
  const c=jobCommercial(p), f=projectFigures(id,today());
  const invoices=[...c.invoices,...c.releases].filter(i=>i.date<=today());
  const refs=new Set(invoices.map(i=>i.id));
  let label='', body='';
  if (key==='contract') {
    label='Revised contract';
    body=constructionPanel(p);

    label='Billed ex tax'; body=drillInvoices(c.invoices.filter(i=>i.date<=today()));
  } else if (key==='cash') {
    label='Cash received'; body=drillReceipts(db.payments.filter(x=>x.type==='received' && x.date<=today() && refs.has(x.ref)));
  } else if (key==='due') {
    label='Trade due'; body=drillInvoices(invoices.filter(i=>drillDueAsOf(i,'received')>0),i=>drillDueAsOf(i,'received'));
  } else if (key==='retention') {
    label='Retention held'; body=drillJournal(db.gl.filter(e=>refs.has(e.ref) && e.date<=today()),l=>l.code===RETENTION_ACCOUNT);
  } else {
    label=key==='margin'?'Billed margin':'Actual cost';

      (key==='margin'?drillInvoices(c.invoices.filter(i=>i.date<=today())):'')+drillProjectCosts(id);

function evmPerformanceMetric(key,id,packageId) {
  const p=job(id), plan=p && evmPlan(p);
  if (!plan || !EVM_METRICS[key]) return;
  const e=evmMetrics(p,projectFigures(id,today()).costs);
  const [name,formula]=EVM_METRICS[key];
  const packages=plan.packages.filter(w=>!packageId || w.id===packageId);
  const details=drillTable(['Work package','Start','Finish','Budget','Planned value','Physical progress','Earned value','Evidence'],packages.map(w=>{
    const progress=p.evm.progress[w.id], values=evmPackageValues(w,progress,today());
    return [esc(w.name),esc(w.start),esc(w.finish),money(w.budget),money(values.pv),(progress?.percent||0)+'%',money(values.ev),esc(progress?.evidence||'—')];
  }));
  const history=packageId ? drillTable(['Date','Baseline','Previous','New','Evidence'],p.evm.updates.flatMap(u=>u.changes
    .filter(c=>c.id===packageId).map(c=>[esc(u.date),esc(u.baseline),c.previous+'%',c.percent+'%',esc(u.evidence)]))) : '';
  performanceDetail(p.name+' · '+(packageId ? packages[0]?.name||name : name),
    `<p>${esc(formula)}${packageId?'':' · <strong>'+(key==='cpi'||key==='spi'?reportIndex(e[key]):reportAmount(e[key]))+'</strong>'}</p>`+
    (packageId?'':`<p><strong>What this means</strong> · ${esc(evmReadout(key,e))}</p>`)+
    (packageId?'':`<p>PV ${money(e.pv)} · EV ${money(e.ev)} · AC ${money(e.ac)} · Baseline ${esc(plan.ref)}</p>`)+details+history+
    (!packageId && ['ac','cv','cpi','eac','etc','vac'].includes(key)?`<h4>Posted job costs</h4>${drillProjectCosts(id)}`:''),
    ()=>evmPerformanceMetric(key,id,packageId));
}

function evmReadout(key,e) {
  const value=e?.[key];
  if (value==null) return 'No result yet. Check that an approved baseline, progress and the relevant cost or planned value are available.';
  if (key==='cpi') return value===1?'Each dollar spent has earned one dollar of budgeted work.':
    'The job has earned '+money(value)+' of budgeted work for each EC$1.00 spent. '+(value<1?'Cost efficiency is below plan.':'Cost efficiency is above plan.');
  if (key==='spi') return value===1?'Budget-weighted progress matches the plan as of today.':
    'The job has earned '+(value*100).toFixed(0)+'% of the planned value due by today. '+(value<1?'Progress is behind plan.':'Progress is ahead of plan.');
  if (key==='cv' || key==='sv') return value===0?'Earned value matches '+(key==='cv'?'actual cost.':'planned value.'):
    money(Math.abs(value))+' of budgeted work '+(key==='cv'?(value<0?'less than actual cost.':'more than actual cost.'):
      (value<0?'behind the schedule plan.':'ahead of the schedule plan.'));
  if (key==='vac') return value===0?'Forecast cost equals the approved work budget.':
    'Forecast cost is '+money(Math.abs(value))+(value<0?' above':' below')+' the approved work budget.';
  if (key==='etc') return 'The forecast expects '+money(value)+' of additional spending to finish the approved work.';
  if (key==='eac') return 'The forecast puts final cost at '+money(value)+'. While work remains, this assumes current cost efficiency continues.';
  if (key==='ac') return 'Posted job costs through today total '+money(value)+'. Compare with earned value to judge cost efficiency.';
  if (key==='ev') return 'The measured work completed is worth '+money(value)+' at its approved budget rates.';
  if (key==='pv') return 'The baseline planned '+money(value)+' of budgeted work to be complete by today.';
  return 'The approved work-package budget totals '+money(value)+' before contingency.';
}
function guideMarkup(title,content) {
  return `<button type="button" class="guide-trigger" data-guide-title="${esc(title)}" data-guide-text="${esc(content)}"
    aria-label="Help: ${esc(title)}" aria-controls="platformGuide" aria-expanded="false">?</button>`;
}
let guideAnchor=null, guidePinned=false;
function closeGuide() {
  const panel=document.getElementById('platformGuide');
  if (typeof panel?.hidePopover==='function' && panel.matches(':popover-open')) panel.hidePopover();
  if (panel) panel.hidden=true;
  guideAnchor?.setAttribute('aria-expanded','false');
  guideAnchor=null; guidePinned=false;
}
function dismissGuide() {
  const anchor=guideAnchor;
  if (anchor && document.activeElement!==anchor) anchor.focus();
  closeGuide();
}
function openGuide(anchor,pin=false) {
  if (!anchor || (guidePinned && !pin)) return;
  const panel=document.getElementById('platformGuide');
  if (!panel) return;
  if (pin && guidePinned && guideAnchor===anchor) { closeGuide(); return; }
  closeGuide();
  guideAnchor=anchor; guidePinned=pin;
  anchor.setAttribute('aria-expanded','true');
  document.getElementById('platformGuideTitle').textContent=anchor.dataset.guideTitle;
  document.getElementById('platformGuideText').textContent=anchor.dataset.guideText;
  panel.hidden=false;
  if (typeof panel.showPopover==='function') panel.showPopover();
  const box=anchor.getBoundingClientRect();
  panel.style.left=Math.max(8,Math.min(box.left,window.innerWidth-panel.offsetWidth-8))+'px';
  const below=box.bottom+8;
  panel.style.top=(below+panel.offsetHeight<=window.innerHeight ? below : Math.max(8,box.top-panel.offsetHeight-8))+'px';
}
function attachGuidance(root) {
  if (!root?.querySelectorAll) return;
  for (const heading of root.querySelectorAll('h3,h4,.sec-title,summary')) {
    const name=heading.textContent.trim(), text=HEADING_GUIDANCE[name];
    if (!text || heading.parentElement?.querySelector(':scope > .guide-trigger')) continue;
    if (heading.tagName==='SUMMARY') heading.insertAdjacentHTML('afterend',guideMarkup(name,text));
    else heading.insertAdjacentHTML('beforeend',guideMarkup(name,text));
  }
  for (const [id,text] of Object.entries(FIELD_GUIDANCE)) {
    const field=root.querySelector('#'+id);
    const label=field?.closest('.field')?.querySelector('label') || field?.closest('label');
    if (!label || label.nextElementSibling?.classList.contains('guide-trigger')) continue;
    label.insertAdjacentHTML('afterend',guideMarkup(label.textContent.trim(),text));
  }
}
document.addEventListener?.('click',event=>{
  const button=event.target.closest?.('.guide-trigger');
  if (button) { openGuide(button,true); return; }
  if (!event.target.closest?.('#platformGuide')) closeGuide();
});
document.addEventListener?.('pointerover',event=>{
  const button=event.target.closest?.('.guide-trigger');
  if (button && event.pointerType==='mouse' && button!==guideAnchor) openGuide(button);
});
document.addEventListener?.('pointerout',event=>{
  if (!guidePinned && event.target===guideAnchor && event.pointerType==='mouse') closeGuide();
});
document.addEventListener?.('focusin',event=>{
  if (event.target.matches?.('.guide-trigger')) openGuide(event.target);
});
document.addEventListener?.('focusout',event=>{
  if (!guidePinned && event.target===guideAnchor) closeGuide();
});
document.addEventListener?.('keydown',event=>{
  if (event.key==='Escape' && guideAnchor) {
    dismissGuide();

let brochureUrl;
function trainingBrochureUrl() {
  if (!brochureUrl) {
    const bytes=Uint8Array.from(atob(TRAINING_BROCHURE),char=>char.charCodeAt(0));
    brochureUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  }
  return brochureUrl;
}
function openTrainingBrochure(download) {
  const link=document.createElement('a');
  link.href=trainingBrochureUrl();
  if (download) link.download='IslandBuild_ERP_Brochure.pdf';
  else { link.target='_blank'; link.rel='noopener noreferrer'; }
  link.click();
}
function viewTraining() {
  return `<div class="grid g2">
    <section class="card"><div class="card-h"><h3>IslandBuild ERP Brochure</h3><span class="pill info">PDF · 2 pages</span></div>
      <div class="card-b"><p>See how IslandBuild brings construction projects, tool rentals, sales, inventory and accounting together.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="openTrainingBrochure(false)">Open brochure</button>
        <button class="btn ghost" onclick="openTrainingBrochure(true)">Download PDF</button></div></div>
    </section>
    <section class="card"><div class="card-h"><h3>Practice with sample records</h3></div>
      <div class="card-b"><p>Follow a construction project from contract to payment, or open the dashboard to see what the numbers mean.</p>
      ${demoAccess()}${DEMO_WORKSPACE ? ` <button class="btn-sm" onclick="go('performance')">Go to Performance Dashboard</button>` : ''}</div>
    </section>
  </div>`;
}
(function boot() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    savedSnapshot = raw;
    const loaded = raw ? validateBackup(JSON.parse(raw)) : null;
    
    if (loaded && loaded.company && loaded.accounts && loaded.items) {
      db = loaded;
      // Ensure all arrays exist to prevent rendering crashes
      db.counters = db.counters || { inv: 0, bill: 0, rnt: 0, pay: 0, je: 0 };
      db.payments = db.payments || []; 
      db.gl = db.gl || [];
      db.invoices = db.invoices || [];
      db.bills = db.bills || [];
      db.rentals = db.rentals || [];
      db.customers = db.customers || [];
      db.vendors = db.vendors || [];
      db.items = db.items || [];
    } else { 
      atomic(()=>seedDatabase(true)); 
    }
    if (DEMO_WORKSPACE) {
      route='performance';
      ui.performanceTab='evm';
    }
    if (window.location?.hash==='#training') route='training';
    save();
    render();
  } catch (err) {
    console.error('Boot error:', err);
    document.getElementById('view').innerHTML = `<div class="card"><div class="card-b" style="color:var(--bad)">
      <h3>⚠️ Failed to Initialize</h3>
      <p>There was a problem loading the application.</p>
      <pre style="background:#f8fafc;padding:12px;border-radius:6px;font-size:12px">${esc(err.message)}</pre>
      <button class="btn" onclick="exportRawData()">Download Stored Data</button>
    </div></div>`;
  }
})();
</script>
</body>
</html>
